<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bingo Bingo 即時開獎</title>
    <style>
        body { font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif; background: #1a1a2e; color: white; display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .card { background: #16213e; border-radius: 20px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 100%; max-width: 500px; text-align: center; border: 1px solid #0f3460; }
        h1 { color: #e94560; margin-bottom: 5px; font-size: 24px; }
        .time { font-size: 14px; color: #95a5a6; margin-bottom: 20px; }
        .ball-container { display: grid; grid-template-columns: repeat(5, 1fr); gap: 15px; justify-items: center; }
        .ball { width: 50px; height: 50px; line-height: 50px; background: radial-gradient(circle at 30% 30%, #ff4d4d, #b30000); color: white; border-radius: 50%; font-weight: bold; font-size: 20px; box-shadow: 0 4px 8px rgba(0,0,0,0.3); transition: transform 0.3s; }
        .ball:hover { transform: scale(1.1); }
        .ball.super { background: radial-gradient(circle at 30% 30%, #ffd700, #b8860b); color: #333; }
        .status { margin-top: 20px; font-size: 12px; color: #4ecca3; }
        .btn-refresh { margin-top: 15px; padding: 8px 20px; background: #e94560; border: none; color: white; border-radius: 5px; cursor: pointer; }
        #loader { font-size: 18px; color: #3498db; margin: 20px 0; }
    </style>
</head>
<body>

<div class="card">
    <h1>Bingo Bingo 即時開獎</h1>
    <div id="time" class="time">正在連接伺服器...</div>
    
    <div id="loader">連線中，請稍候...</div>
    <div id="bingo-balls" class="ball-container"></div>
    
    <button class="btn-refresh" onclick="fetchData()">手動更新</button>
    <div id="status" class="status">自動更新已啟動 (每 30 秒)</div>
</div>

<script>
    // 【重要】請將下方網址替換成你在 Google Apps Script 部署得到的網址
    const apiURL = 'https://script.google.com/macros/s/AKfycbwoknT9PabJnAsss0nI1s7b_YlkYt-3emXEoJd7BowV-7lj3gfzIFj83sm7TzIVaJKuzA/exec';

    async function fetchData() {
        const ballContainer = document.getElementById('bingo-balls');
        const loader = document.getElementById('loader');
        const timeLabel = document.getElementById('time');

        try {
            const response = await fetch(apiURL);
            const data = await response.json();

            if (data.success && data.numbers.length > 0) {
                loader.style.display = 'none';
                ballContainer.innerHTML = '';
                timeLabel.innerText = '更新時間：' + data.time;

                data.numbers.forEach((num, index) => {
                    const div = document.createElement('div');
                    div.className = 'ball';
                    // 假設最後一個是超級獎號
                    if (index === data.numbers.length - 1) div.classList.add('super');
                    div.innerText = num;
                    ballContainer.appendChild(div);
                });
            } else {
                loader.innerText = '抓取不到資料，請檢查 GAS 設定';
            }
        } catch (error) {
            loader.innerText = '連線失敗：' + error.message;
        }
    }

    // 初始抓取
    fetchData();
    // 設定每 30 秒自動更新一次
    setInterval(fetchData, 30000);
</script>

</body>
</html>
