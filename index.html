<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台股即時強勢雷達 - 終極版</title>
    <style>
        :root {
            --bg: #0d1117;
            --card: #161b22;
            --border: #30363d;
            --primary: #58a6ff;
            --up: #f85149;
            --down: #3fb950;
        }
        body {
            font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: #c9d1d9;
            margin: 0;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        .header {
            background: var(--card);
            padding: 25px;
            border-radius: 12px;
            border: 1px solid var(--border);
            text-align: center;
            margin-bottom: 25px;
        }
        .btn-scan {
            background: #238636;
            color: white;
            border: none;
            padding: 14px 40px;
            border-radius: 6px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-scan:hover { background: #2ea043; transform: scale(1.02); }
        .status-bar { margin-top: 15px; font-size: 0.9rem; color: #8b949e; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 18px;
            transition: transform 0.2s;
            border-left: 5px solid transparent;
        }
        .card:hover { transform: translateY(-3px); border-color: var(--primary); }
        .card.is-up { border-left-color: var(--up); }
        .card.is-down { border-left-color: var(--down); }
        .symbol { font-size: 1.4rem; font-weight: bold; color: var(--primary); }
        .name { font-size: 0.9rem; color: #8b949e; margin-left: 8px; }
        .price-box { margin: 15px 0; display: flex; align-items: baseline; }
        .price { font-size: 2.2rem; font-weight: 800; }
        .pct { font-size: 1.1rem; margin-left: 10px; font-weight: bold; }
        .details {
            font-size: 0.85rem;
            color: #8b949e;
            border-top: 1px solid #2d333b;
            padding-top: 10px;
            display: flex;
            justify-content: space-between;
        }
        #debug {
            background: #000;
            color: #0f0;
            padding: 10px;
            font-size: 12px;
            border-radius: 6px;
            margin-top: 15px;
            display: none;
            text-align: left;
            white-space: pre-wrap;
            border: 1px solid #444;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>📊 台股即時雷達</h1>
        <p>監測核心權值與產業熱門標的</p>
        <button class="btn-scan" onclick="startScan()">⚡ 刷新即時報價</button>
        <div id="status" class="status-bar">準備就緒</div>
        <div id="debug"></div>
    </div>

    <div id="results" class="grid"></div>
</div>

<script>
    // === 1. 請在此處填入你部署的 Google Script 網址 ===
    const myProxy = "https://script.google.com/macros/s/AKfycbyTPkVDP9U1aOs_WJnEY7t9axOArILB4hjVGLzUmw33QBHqDhuvpnPa-ykF9qH-zbjs/exec";

    async function startScan() {
        const results = document.getElementById('results');
        const status = document.getElementById('status');
        const debug = document.getElementById('debug');

        results.innerHTML = "";
        debug.style.display = "none";
        status.innerText = "⏳ 正在啟動全自動格式解析機制...";

        if (myProxy.includes("你的")) {
            alert("請先修改代碼填入正確的 Google Script URL");
            return;
        }

        try {
            // 精選台股熱門池（權值、AI、重電、航運、散熱、半導體）
            const stocksPool = [
                "2330.TW","2317.TW","2454.TW","2382.TW","3231.TW",
                "2308.TW","2303.TW","2603.TW","2609.TW","1513.TW",
                "1519.TW","3017.TW","3376.TW","2353.TW","2881.TW",
                "2409.TW","3481.TW","2618.TW","2376.TW","3037.TW"
            ];
            
            const target = `https://query1.finance.yahoo.com/v7/finance/quote?symbols=${stocksPool.join(',')}`;
            const finalUrl = `${myProxy}?url=${encodeURIComponent(target)}`;

            const response = await fetch(finalUrl);
            const text = await response.text();
            
            // 診斷：是否拿到 HTML 或錯誤
            if (text.includes("<!DOCTYPE html>")) {
                throw new Error("收到 Google 登入頁面，請將 GAS 部署權限設為『所有人(Anyone)』並選新版本發布。");
            }

            const data = JSON.parse(text);

            // === 2. 自動識別 JSON 結構 (兼容所有 Yahoo V7/V8/Screener 變體) ===
            let list = null;
            if (data.quoteResponse && data.quoteResponse.result) {
                list = data.quoteResponse.result;
            } else if (data.finance && data.finance.result) {
                list = data.finance.result;
            } else if (Array.isArray(data.result)) {
                list = data.result;
            } else if (data.quoteResponse && Array.isArray(data.quoteResponse)) {
                list = data.quoteResponse;
            }

            if (!list || list.length === 0) {
                console.error("原始數據:", data);
                throw new Error("Yahoo 回傳成功但找不到股票清單結構。");
            }

            status.innerText = `✅ 更新完成：${new Date().toLocaleTimeString()} (偵測到 ${list.length} 檔)`;
            
            list.forEach(s => {
                const price = s.regularMarketPrice || 0;
                const change = s.regularMarketChangePercent || 0;
                const isUp = change >= 0;
                const color = isUp ? "var(--up)" : "var(--down)";

                const card = document.createElement('div');
                card.className = `card ${isUp ? 'is-up' : 'is-down'}`;
                card.innerHTML = `
                    <div class="stock-header">
                        <div class="symbol">${(s.symbol || "").split('.')[0]}</div>
                        <div class="name">${s.shortName || '台股'}</div>
                    </div>
                    <div class="price-box" style="color: ${color}">
                        <div class="price">${price.toFixed(2)}</div>
                        <div class="pct">${isUp ? '▲' : '▼'}${Math.abs(change).toFixed(2)}%</div>
                    </div>
                    <div class="details">
                        <span>量：${Math.floor((s.regularMarketVolume || 0) / 1000)} 張</span>
                        <span>昨收：${(s.regularMarketPreviousClose || 0).toFixed(2)}</span>
                    </div>
                `;
                results.appendChild(card);
            });

        } catch (err) {
            status.innerText = "❌ 掃描程序發生中斷";
            debug.style.display = "block";
            debug.innerText = "診斷資訊：\n" + err.message + "\n\n建議動作：\n1. 確認 GAS 部署為『Anyone』\n2. 點擊 GAS 右上角『部署』->『管理部署』->『編輯』並選擇『新版本』再發布一次。";
        }
    }
</script>

</body>
</html>
