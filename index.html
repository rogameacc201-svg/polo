<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>台股雷達 - 強健版</title>
    <style>
        :root { --bg: #0d1117; --card: #161b22; --border: #30363d; --accent: #58a6ff; --up: #f85149; --down: #3fb950; }
        body { font-family: sans-serif; background: var(--bg); color: #c9d1d9; padding: 20px; }
        .box { background: var(--card); border: 1px solid var(--border); padding: 25px; border-radius: 8px; text-align: center; }
        .btn { background: #238636; color: white; border: none; padding: 12px 30px; border-radius: 6px; cursor: pointer; font-size: 1rem; }
        .debug-log { background: #000; color: #0f0; padding: 15px; border-radius: 6px; margin-top: 20px; text-align: left; font-family: monospace; white-space: pre-wrap; font-size: 0.8rem; display: none; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; margin-top: 20px; }
        .card { background: var(--card); border: 1px solid var(--border); padding: 15px; border-radius: 8px; border-left: 5px solid transparent; }
        .up { border-left-color: var(--up); color: var(--up); }
        .down { border-left-color: var(--down); color: var(--down); }
    </style>
</head>
<body>

<div class="box">
    <h1>🇹🇼 台股即時雷達 (穩定版)</h1>
    <p>如果榜單暫無台股，系統會自動切換搜尋策略</p>
    <button class="btn" onclick="startScan()">🚀 啟動掃描</button>
    <div id="status" style="margin-top:15px;">準備就緒</div>
    <div id="debug" class="debug-log"></div>
</div>

<div id="results" class="grid"></div>

<script>
const myProxy = "https://script.google.com/macros/s/AKfycbyTPkVDP9U1aOs_WJnEY7t9axOArILB4hjVGLzUmw33QBHqDhuvpnPa-ykF9qH-zbjs/exec";

async function startScan() {
    const status = document.getElementById('status');
    const debug = document.getElementById('debug');
    const results = document.getElementById('results');
    
    status.innerText = "🔍 正在同步數據中...";
    debug.style.display = "block";
    debug.innerText = "系統日誌：嘗試連線 Yahoo Finance...";
    results.innerHTML = "";

    try {
        // 第一波：嘗試台股漲幅榜
        let apiTarget = "https://query2.finance.yahoo.com/v1/finance/screener/predefined/saved?scrIds=day_gainers_taiwan&count=50";
        let fetchUrl = `${myProxy}?url=${encodeURIComponent(apiTarget)}`;
        
        let response = await fetch(fetchUrl);
        let text = await response.text();
        
        debug.innerText += "\n收到響應長度: " + text.length;

        let data = JSON.parse(text);

        // --- 安全檢查層 ---
        if (!data.finance || !data.finance.result || !data.finance.result[0]) {
            debug.innerText += "\n⚠️ 主要榜單無回應，切換至備用榜單...";
            // 切換至：全球熱門榜單
            apiTarget = "https://query2.finance.yahoo.com/v1/finance/screener/predefined/saved?scrIds=most_actives&count=100";
            fetchUrl = `${myProxy}?url=${encodeURIComponent(apiTarget)}`;
            response = await fetch(fetchUrl);
            text = await response.text();
            data = JSON.parse(text);
        }

        // --- 最終過濾層 ---
        let quotes = data.finance.result[0].quotes || [];
        // 如果是全球榜單，過濾出台股
        const stocks = quotes.filter(q => q.symbol.endsWith('.TW') || q.symbol.endsWith('.TWO'));

        if (stocks.length === 0) {
            status.innerText = "⚠️ 目前所有榜單皆無台股標的 (非交易時段或數據延遲)";
            debug.innerText += "\nYahoo 回傳內容: " + text.substring(0, 200);
            return;
        }

        status.innerText = `✅ 成功！偵測到 ${stocks.length} 檔熱門台股`;
        
        stocks.forEach(s => {
            const price = s.regularMarketPrice || 0;
            const change = s.regularMarketChangePercent || 0;
            const isUp = change >= 0;
            
            const card = document.createElement('div');
            card.className = `card ${isUp ? 'up' : 'down'}`;
            card.innerHTML = `
                <div style="font-weight:bold; color:var(--accent)">${s.symbol.split('.')[0]} <span style="color:#8b949e; font-size:0.8rem;">${s.shortName || ''}</span></div>
                <div style="font-size:1.8rem; margin:10px 0; font-weight:bold;">
                    ${price.toFixed(2)}
                    <span style="font-size:1rem;">${isUp ? '▲' : '▼'}${Math.abs(change).toFixed(2)}%</span>
                </div>
                <div style="font-size:0.8rem; color:#8b949e;">成交張數：${Math.floor(s.regularMarketVolume / 1000) || '--'}</div>
            `;
            results.appendChild(card);
        });

    } catch (err) {
        status.innerText = "❌ 解析發生異常";
        debug.innerText += "\n\n錯誤詳情：\n" + err.toString();
        debug.innerText += "\n\n請確認您的 GAS 代碼是否已加入 headers 偽裝，避免被 Yahoo 封鎖。";
    }
}
</script>
</body>
</html>
