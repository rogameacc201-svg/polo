<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>即時熱門股 AI 掃描儀</title>
    <style>
        :root { --bg: #0b0e14; --card: #151921; --primary: #3b82f6; --up: #f23645; --down: #089981; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: #d1d4dc; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .header { background: var(--card); padding: 30px; border-radius: 16px; text-align: center; border: 1px solid #2a2e39; margin-bottom: 20px; }
        .btn-live { background: linear-gradient(135deg, #0062ff, #0040ff); color: white; border: none; padding: 16px 32px; border-radius: 50px; font-size: 1.2rem; font-weight: bold; cursor: pointer; box-shadow: 0 4px 15px rgba(0,98,255,0.4); transition: 0.3s; }
        .btn-live:hover { transform: scale(1.05); box-shadow: 0 6px 20px rgba(0,98,255,0.6); }
        .loader { display: none; margin: 20px auto; border: 4px solid #2a2e39; border-top: 4px solid var(--primary); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
        .card { background: var(--card); border-radius: 12px; padding: 20px; border: 1px solid #2a2e39; transition: 0.3s; position: relative; }
        .card:hover { border-color: var(--primary); }
        .price-row { display: flex; justify-content: space-between; align-items: center; margin: 15px 0; }
        .price { font-size: 2rem; font-weight: bold; color: #fff; }
        .change { font-size: 1.2rem; font-weight: bold; }
        .indicator { background: #2a2e39; padding: 10px; border-radius: 8px; font-size: 0.9rem; margin-top: 10px; }
        .links { margin-top: 15px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .link { text-align: center; padding: 10px; border-radius: 6px; background: #2a2e39; color: #fff; text-decoration: none; font-size: 0.8rem; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>📡 即時市場熱門標的 AI 掃描</h1>
        <p>不使用預設名單，直接從 Yahoo Finance API 擷取目前全市場交易最活躍標的</p>
        <button class="btn-live" onclick="scanMarket()">立即擷取當前熱門股並分析</button>
        <div id="loader" class="loader"></div>
        <p id="status" style="margin-top:15px; color: #848e9c;"></p>
    </div>

    <div id="results" class="grid"></div>
</div>

<script>
async function scanMarket() {
    const results = document.getElementById('results');
    const loader = document.getElementById('loader');
    const status = document.getElementById('status');
    
    results.innerHTML = '';
    loader.style.display = 'block';
    status.innerText = "正在連線至市場獲取當前成交量熱門名單...";

    try {
        // 第一步：從 Yahoo Finance 抓取當下全台股成交量最活躍的標的
        // 我們抓取排行中的標的，這不是預設的，而是由市場交易量決定的
        const hotResponse = await fetch(`https://query2.finance.yahoo.com/v1/finance/screener/predefined/saved?formatted=false&scrIds=most_actives&count=50`);
        const hotData = await hotResponse.json();
        const activeStocks = hotData.finance.result[0].quotes
            .filter(q => q.symbol.endsWith('.TW')) // 只過濾台股
            .map(q => q.symbol);

        if (activeStocks.length === 0) {
            // 如果 API 沒抓到，嘗試第二種方式 (抓取權值股與高成交量區段)
            throw new Error("即時榜單擷取失敗，改用廣度掃描模式");
        }

        status.innerText = `已發現 ${activeStocks.length} 檔即時熱門股，開始計算均線與量能...`;

        let candidates = [];

        // 第二步：對這些「即時」標的進行深度分析
        for (let i = 0; i < activeStocks.length; i++) {
            let ticker = activeStocks[i];
            try {
                const res = await fetch(`https://query1.finance.yahoo.com/v8/finance/chart/${ticker}?range=1mo&interval=1d`);
                const data = await res.json();
                const quote = data.chart.result[0].indicators.quote[0];
                const close = data.chart.result[0].indicators.adjclose[0].adjclose;
                const vol = quote.volume;

                if (close.length < 20) continue;

                const ma = (arr, n) => arr.slice(-n).reduce((a,b)=>a+b)/n;
                const m5 = ma(close, 5);
                const m10 = ma(close, 10);
                const m20 = ma(close, 20);
                const v5 = ma(vol, 5);

                const currentPrice = close[close.length - 1];
                const prevPrice = close[close.length - 2];
                const currentVol = vol[vol.length - 1];
                const change = ((currentPrice - prevPrice) / prevPrice) * 100;
                const volRatio = currentVol / v5;

                // 分析條件：多頭排列 + 量能異常
                if (m5 > m10 && m10 > m20 && currentPrice > m5) {
                    candidates.push({
                        symbol: ticker.replace('.TW', ''),
                        price: currentPrice.toFixed(2),
                        change: change.toFixed(2),
                        volRatio: volRatio.toFixed(2),
                        score: (change * 2 + volRatio).toFixed(1)
                    });
                }
            } catch (e) {}
        }

        candidates.sort((a, b) => b.score - a.score);

        loader.style.display = 'none';
        status.innerText = `分析完成！在今日熱門榜中挑選出 ${candidates.length} 檔強勢股。`;

        candidates.forEach(s => {
            results.innerHTML += `
                <div class="card">
                    <div style="color:var(--primary); font-weight:bold;">🏆 強勢推薦</div>
                    <div style="font-size: 1.5rem; font-weight: bold; margin-top: 5px;">${s.symbol}</div>
                    <div class="price-row">
                        <div class="price">${s.price}</div>
                        <div class="change" style="color:${s.change >= 0 ? 'var(--up)' : 'var(--down)'}">
                            ${s.change >= 0 ? '+' : ''}${s.change}%
                        </div>
                    </div>
                    <div class="indicator">
                        📊 量能表現：今日為均量的 <b>${s.volRatio}</b> 倍<br>
                        📈 技術診斷：5/10/20MA 呈多頭排列
                    </div>
                    <div class="links">
                        <a class="link" target="_blank" href="https://www.google.com/search?q=${s.symbol}+新聞&tbm=nws">🔍 相關新聞</a>
                        <a class="link" target="_blank" href="https://tw.stock.yahoo.com/quote/${s.symbol}.TW">📋 詳細報價</a>
                    </div>
                </div>
            `;
        });

    } catch (err) {
        loader.style.display = 'none';
        status.innerText = "連線異常，請確認是否安裝並啟動了 Allow CORS 插件。";
    }
}
</script>

</body>
</html>
