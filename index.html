<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>台股即時強勢雷達 - 終極修復版</title>
    <style>
        :root { --bg: #0d1117; --card: #161b22; --border: #30363d; --primary: #58a6ff; --up: #f85149; --down: #3fb950; --text: #c9d1d9; --gray: #8b949e; }
        body { font-family: sans-serif; background-color: var(--bg); color: var(--text); padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 1000px; }
        .header { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 25px; text-align: center; margin-bottom: 25px; }
        .btn-scan { background-color: #238636; color: white; border: none; padding: 15px 40px; border-radius: 8px; font-size: 1.1rem; cursor: pointer; font-weight: bold; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 18px; border-left: 6px solid #444; }
        .price { font-size: 2.2rem; font-weight: 900; margin: 10px 0; }
        #debug-log { background: #000; color: #0f0; padding: 10px; font-size: 11px; margin-top: 15px; display: none; text-align: left; border: 1px solid #444; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>📊 台股即時掃描</h1>
        <button class="btn-scan" id="btnScan">⚡ 執行動態掃描</button>
        <div id="status" style="margin-top:15px; color:var(--gray);">等待指令中...</div>
        <div id="debug-log"></div>
    </div>
    <div id="results" class="grid"></div>
</div>

<script>
    // ⚠️ 填入你最新的 GAS 網址
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwSwX_jCqPGtSSXJek3p9T4sxiRbYzmd-WO_GlGvMTuaoYJqwhe5234Dqi0wmjQq6A/exec";

    const btn = document.getElementById('btnScan');
    const status = document.getElementById('status');
    const results = document.getElementById('results');
    const debug = document.getElementById('debug-log');

    btn.addEventListener('click', async () => {
        if (GAS_URL.includes("你的")) { alert("請設定 GAS 網址"); return; }
        
        results.innerHTML = "";
        debug.style.display = "none";
        status.innerText = "⏳ 正在請求雲端數據...";

        try {
            // 加入隨機參數防快取
            const target = `${GAS_URL}${GAS_URL.includes('?') ? '&' : '?'}t=${Date.now()}`;
            const response = await fetch(target);
            const text = await response.text();
            
            // 嘗試解析 JSON
            let data;
            try {
                data = JSON.parse(text);
            } catch (e) {
                debug.style.display = "block";
                debug.innerText = "收到非 JSON 資料：\n" + text.substring(0, 500);
                throw new Error("回傳格式錯誤");
            }

            const list = data.result || [];
            if (list.length === 0) {
                status.innerText = "⚠️ 抓取成功但資料陣列為空";
                return;
            }

            list.forEach(s => {
                const change = s.regularMarketChangePercent || 0;
                const isUp = change >= 0;
                const color = isUp ? "var(--up)" : "var(--down)";
                const card = document.createElement('div');
                card.className = "card";
                card.style.borderLeftColor = color;
                card.innerHTML = `
                    <div style="display:flex; justify-content:space-between; align-items:center">
                        <b style="font-size:1.2rem; color:var(--primary)">${(s.symbol || "").split('.')[0]}</b>
                        <span style="color:var(--gray)">${s.shortName || ''}</span>
                    </div>
                    <div class="price" style="color:${color}">
                        ${(s.regularMarketPrice || 0).toFixed(2)}
                        <span style="font-size:1.1rem">${isUp ? '▲' : '▼'}${Math.abs(change).toFixed(2)}%</span>
                    </div>
                    <div style="font-size:0.85rem; color:var(--gray); border-top:1px solid #333; padding-top:8px">
                        成交量: ${Math.floor((s.regularMarketVolume || 0) / 1000).toLocaleString()} 張
                    </div>
                `;
                results.appendChild(card);
            });

            status.innerText = `✅ 成功！已更新 ${list.length} 檔標的`;

        } catch (err) {
            status.innerText = "❌ 發生錯誤";
            console.error(err);
        }
    });
</script>

</body>
</html>
