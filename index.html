<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全螢幕 YouTube 播放器</title>
    <style>
        /* 移除瀏覽器預設邊距 */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body, html {
            width: 100%;
            height: 100%;
            background-color: #000; /* 背景設為黑色，觀影效果較佳 */
            overflow: hidden; /* 防止出現捲軸 */
            font-family: Arial, sans-serif;
        }

        /* 上方輸入列：設為半透明浮動層 */
        .controls {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 10;
            padding: 15px;
            background: rgba(0, 0, 0, 0.5); /* 半透明黑 */
            display: flex;
            justify-content: center;
            gap: 10px;
            transition: opacity 0.3s;
        }

        /* 滑鼠沒移上去時隱藏控制列，讓畫面更乾淨 */
        .controls:hover { opacity: 1; }
        .controls { opacity: 0.8; }

        input {
            padding: 12px;
            width: 60%;
            max-width: 500px;
            border: none;
            border-radius: 4px;
            outline: none;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
            background: #ff0000;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
        }

        /* 影片容器：填滿整個螢幕 */
        .video-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="controls">
        <input type="text" id="videoUrl" placeholder="請貼上 YouTube 連結 (例如: https://www.youtube.com/watch?v=...)">
        <button onclick="playVideo()">播放</button>
    </div>

    <div class="video-wrapper">
        <iframe id="player" src="" allow="autoplay; fill-screen; encrypted-media" allowfullscreen></iframe>
    </div>

    <script>
        function playVideo() {
            const urlInput = document.getElementById('videoUrl').value;
            const videoId = extractVideoID(urlInput);

            if (videoId) {
                const player = document.getElementById('player');
                // 使用 embed 網址，並加入參數讓功能更完整
                // rel=0: 結束後不顯示推薦影片; autoplay=1: 自動播放
                player.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0&modestbranding=1`;
            } else {
                alert("網址格式不正確，請重新輸入。");
            }
        }

        function extractVideoID(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }
        
        // 支援按下 Enter 鍵直接播放
        document.getElementById('videoUrl').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                playVideo();
            }
        });
    </script>

</body>
</html>
