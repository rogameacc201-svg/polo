<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>私有通道版 - 即時強勢股雷達</title>
    <style>
        :root { --bg: #05070a; --card: #12151c; --primary: #00d2ff; --up: #ff3b30; }
        body { font-family: sans-serif; background: var(--bg); color: #e0e0e0; padding: 20px; }
        .setup-notice { background: #1a1f2b; border: 1px solid #333; padding: 15px; border-radius: 8px; margin-bottom: 20px; color: #ffab00; font-size: 0.9rem; }
        .control-panel { background: var(--card); padding: 30px; border-radius: 16px; text-align: center; border-bottom: 4px solid var(--primary); }
        .btn-scan { background: var(--primary); color: #000; border: none; padding: 15px 40px; border-radius: 30px; font-weight: bold; cursor: pointer; font-size: 1.1rem; }
        .btn-scan:hover { filter: brightness(1.2); }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; margin-top: 30px; }
        .card { background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid #2d333b; }
        .ticker { font-size: 1.5rem; font-weight: bold; color: #fff; }
        .status { margin-top: 10px; color: #888; font-family: monospace; }
        .score-tag { float: right; background: #222; color: var(--primary); padding: 4px 8px; border-radius: 4px; border: 1px solid var(--primary); }
    </style>
</head>
<body>

<div class="setup-notice">
    ⚠️ 提示：請確保已將 Google Apps Script 的部署網址填入代碼中，否則無法連線。
</div>

<div class="control-panel">
    <h1>📡 私人雷達：全自動即時掃描</h1>
    <p>不設清單，即時從 Yahoo 抓取成交量前 50 名進行 AI 診斷</p>
    <button class="btn-scan" onclick="startScanner()">⚡ 立即啟動掃描 (私人通道)</button>
    <div id="status" class="status">等待指令中...</div>
</div>

<div id="results" class="grid"></div>

<script>
// !!! 請在此處填入你部署的 Google Script URL !!!
const myProxy = "https://script.google.com/macros/s/AKfycbyZr1LgjVdnm-jBQXeXg1mwIn3IwnI0L8qo6gsfTlgVFDhMIwdy6pqNKqxs5TUqlOE/exec";

async function startScanner() {
    if(myProxy.includes("你的")) { alert("請先填入 Google Script URL"); return; }
    
    const results = document.getElementById('results');
    const status = document.getElementById('status');
    results.innerHTML = '';
    status.innerText = "🌐 正在透過私人通道獲取即時熱門榜單...";

    try {
        const hotUrl = "https://query2.finance.yahoo.com/v1/finance/screener/predefined/saved?formatted=false&scrIds=most_actives&count=50";
        const response = await fetch(`${myProxy}?url=${encodeURIComponent(hotUrl)}`);
        const data = await response.json();
        const activeStocks = data.finance.result[0].quotes.filter(q => q.symbol.endsWith('.TW') || q.symbol.endsWith('.TWO'));

        status.innerText = `🔍 已發現 ${activeStocks.length} 檔即時標的，正在計算量價...`;

        for (let stock of activeStocks) {
            try {
                const chartUrl = `https://query1.finance.yahoo.com/v8/finance/chart/${stock.symbol}?range=1mo&interval=1d`;
                const charRes = await fetch(`${myProxy}?url=${encodeURIComponent(chartUrl)}`);
                const charData = await charRes.json();
                
                const quote = charData.chart.result[0].indicators.quote[0];
                const close = charData.chart.result[0].indicators.adjclose[0].adjclose;
                const lastClose = close[close.length - 1];
                const prevClose = close[close.length - 2];
                const vol = quote.volume;
                const avgVol = vol.slice(-5).reduce((a,b)=>a+b)/5;
                const volRatio = vol[vol.length-1] / avgVol;
                const change = ((lastClose - prevClose)/prevClose*100).toFixed(2);

                if(lastClose > (close.slice(-5).reduce((a,b)=>a+b)/5) && volRatio > 1.2) {
                    results.innerHTML += `
                        <div class="card">
                            <span class="score-tag">熱度 ${(volRatio * 2).toFixed(1)}</span>
                            <div class="ticker">${stock.symbol.split('.')[0]}</div>
                            <div style="font-size: 1.8rem; margin: 10px 0; color: ${change >= 0 ? '#ff3b30' : '#34c759'}">
                                ${lastClose.toFixed(2)} <small>(${change >= 0 ? '+' : ''}${change}%)</small>
                            </div>
                            <div style="color:#aaa; font-size:0.9rem;">
                                💥 成交量為均量 ${volRatio.toFixed(2)} 倍<br>
                                ✅ 目前股價站上 5 日均線
                            </div>
                        </div>`;
                }
            } catch(e) {}
        }
        status.innerText = "🎯 掃描完成。";
    } catch (err) {
        status.innerText = "❌ 連線失敗，請檢查 Script 權限是否設為「所有人」。";
    }
}
</script>
</body>
</html>
