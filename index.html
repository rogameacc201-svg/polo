<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>台股雷達 - 最終穩定版</title>
    <style>
        :root { --bg: #0d1117; --card: #161b22; --border: #30363d; --accent: #58a6ff; }
        body { font-family: sans-serif; background: var(--bg); color: #c9d1d9; padding: 20px; }
        .box { background: var(--card); border: 1px solid var(--border); padding: 25px; border-radius: 8px; text-align: center; }
        .btn { background: #238636; color: white; border: none; padding: 12px 30px; border-radius: 6px; cursor: pointer; font-size: 1rem; }
        .debug-log { background: #000; color: #0f0; padding: 15px; border-radius: 8px; margin-top: 20px; text-align: left; font-family: monospace; white-space: pre-wrap; font-size: 0.8rem; display: none; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 15px; margin-top: 20px; }
        .card { background: var(--card); border: 1px solid var(--border); padding: 15px; border-radius: 8px; }
        .up { color: #f85149; } .down { color: #3fb950; }
    </style>
</head>
<body>

<div class="box">
    <h1>🇹🇼 台股監測 - 強力掃描版</h1>
    <p>優先搜尋台股漲幅榜標的</p>
    <button class="btn" onclick="startScan()">🚀 開始即時掃描</button>
    <div id="status" style="margin-top:15px;">準備就緒</div>
    <div id="debug" class="debug-log"></div>
</div>

<div id="results" class="grid"></div>

<script>
const myProxy = "https://script.google.com/macros/s/AKfycbyTPkVDP9U1aOs_WJnEY7t9axOArILB4hjVGLzUmw33QBHqDhuvpnPa-ykF9qH-zbjs/exec";

async function startScan() {
    const status = document.getElementById('status');
    const debug = document.getElementById('debug');
    const results = document.getElementById('results');
    
    status.innerText = "正在連線私人通道...";
    debug.style.display = "block";
    debug.innerText = "系統日誌：開始連線...";
    results.innerHTML = "";

    try {
        // 改用台股專屬漲幅榜，確保 100% 抓到台股
        const target = "https://query2.finance.yahoo.com/v1/finance/screener/predefined/saved?scrIds=day_gainers_taiwan&count=50";
        const fetchUrl = `${myProxy}?url=${encodeURIComponent(target)}`;
        
        const response = await fetch(fetchUrl);
        const text = await response.text();
        
        debug.innerText += "\n系統日誌：成功通訊，數據長度 " + text.length;

        // 檢查權限
        if (text.includes("<!DOCTYPE html>") || text.includes("login")) {
            status.innerText = "❌ 失敗：請檢查 Google 部署權限是否為「所有人」";
            return;
        }

        const data = JSON.parse(text);
        const stocks = data.finance.result[0].quotes;

        if (!stocks || stocks.length === 0) {
            status.innerText = "⚠️ 榜單目前為空 (可能非交易時段)";
            return;
        }

        status.innerText = `✅ 掃描成功！找到 ${stocks.length} 檔強勢台股`;
        
        stocks.forEach(s => {
            const price = s.regularMarketPrice || 0;
            const change = s.regularMarketChangePercent || 0;
            const isUp = change >= 0;
            const symbol = s.symbol.split('.')[0];
            
            results.innerHTML += `
                <div class="card">
                    <b style="color:var(--accent)">${symbol}</b> ${s.shortName || ''}<br>
                    <div style="font-size:1.8rem; margin:10px 0;" class="${isUp ? 'up' : 'down'}">
                        ${price.toFixed(2)} 
                        <span style="font-size:1rem;">(${isUp ? '+' : ''}${change.toFixed(2)}%)</span>
                    </div>
                    <small>成交張數：${Math.floor(s.regularMarketVolume / 1000) || '--'}</small>
                </div>`;
        });

    } catch (err) {
        status.innerText = "❌ 程序執行錯誤";
        debug.innerText += "\n\n錯誤詳情：\n" + err.toString();
    }
}
</script>
</body>
</html>
