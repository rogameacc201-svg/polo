<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台股即時強勢雷達</title>
    <style>
        :root { --bg: #0d1117; --card: #161b22; --border: #30363d; --primary: #58a6ff; --up: #f85149; --down: #3fb950; --text: #c9d1d9; --gray: #8b949e; }
        * { box-sizing: border-box; }
        body { font-family: sans-serif; background-color: var(--bg); color: var(--text); padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 1000px; }
        .header { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 25px; text-align: center; margin-bottom: 20px; }
        .btn-scan { background-color: #238636; color: white; border: none; padding: 12px 30px; border-radius: 6px; font-size: 1.1rem; cursor: pointer; font-weight: bold; }
        .btn-scan:hover { background-color: #2ea043; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 15px; border-left: 5px solid #444; }
        .symbol { font-size: 1.2rem; font-weight: 800; color: var(--primary); }
        .price { font-size: 2rem; font-weight: 900; margin: 10px 0; }
        .status-msg { margin-top: 10px; color: var(--gray); font-size: 0.9rem; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>📊 台股即時成交量雷達</h1>
        <button class="btn-scan" id="mainBtn">⚡ 執行即時掃描</button>
        <div id="status" class="status-msg">等待指令中...</div>
    </div>
    <div id="results" class="grid"></div>
</div>

<script>
    // ⚠️ 請務必在此處填入你的 GAS 網址 (記得保留引號)
    const GAS_URL = "https://script.google.com/macros/s/AKfycbyZr1LgjVdnm-jBQXeXg1mwIn3IwnI0L8qo6gsfTlgVFDhMIwdy6pqNKqxs5TUqlOE/exec";

    // 使用更穩定的監聽器寫法，避免 onclick 找不到函數
    document.getElementById('mainBtn').addEventListener('click', async function() {
        const resultsContainer = document.getElementById('results');
        const statusDisplay = document.getElementById('status');

        if (GAS_URL.includes("你的")) {
            alert("請先在代碼中填入你的 GAS 網址！");
            return;
        }

        resultsContainer.innerHTML = "";
        statusDisplay.innerText = "⏳ 正在連線至雲端引擎...";
        statusDisplay.style.color = "var(--gray)";

        try {
            const response = await fetch(GAS_URL);
            const data = await response.json();

            if (data.error) throw new Error(data.error);

            const list = data.result || [];
            if (list.length === 0) {
                statusDisplay.innerText = "⚠️ 抓取成功但無資料 (可能非交易時間)";
                return;
            }

            list.forEach(stock => {
                const changePercent = stock.regularMarketChangePercent || 0;
                const isUp = changePercent >= 0;
                const color = isUp ? "var(--up)" : "var(--down)";

                const card = document.createElement('div');
                card.className = "card";
                card.style.borderLeftColor = color;
                card.innerHTML = `
                    <div style="display:flex; justify-content:space-between">
                        <span class="symbol">${stock.symbol.split('.')[0]}</span>
                        <span style="color:var(--gray)">${stock.shortName || ''}</span>
                    </div>
                    <div class="price" style="color:${color}">
                        ${(stock.regularMarketPrice || 0).toFixed(2)}
                        <span style="font-size:1rem">${isUp ? '▲' : '▼'}${Math.abs(changePercent).toFixed(2)}%</span>
                    </div>
                    <div style="font-size:0.8rem; color:var(--gray)">
                        量：${Math.floor((stock.regularMarketVolume || 0)/1000).toLocaleString()} 張
                    </div>
                `;
                resultsContainer.appendChild(card);
            });

            statusDisplay.innerText = `✅ 掃描完成 (${new Date().toLocaleTimeString()})`;
            statusDisplay.style.color = "var(--primary)";

        } catch (err) {
            statusDisplay.innerText = "❌ 錯誤：" + err.message;
            statusDisplay.style.color = "var(--up)";
        }
    });
</script>

</body>
</html>
