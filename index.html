<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>極簡全螢幕播放器</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body, html {
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: "Microsoft JhengHei", Arial, sans-serif;
        }

        /* 控制列：增加過渡動畫 */
        .controls {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 10;
            padding: 15px;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            gap: 10px;
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* 當播放時，將控制列向上推移隱藏 */
        .controls.hidden {
            transform: translateY(-100%);
        }

        /* 偵測滑鼠靠近上方時，自動顯現控制列 */
        .hover-trigger {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 50px;
            z-index: 11;
        }

        input {
            padding: 12px;
            width: 60%;
            max-width: 500px;
            border: 1px solid #444;
            background: #222;
            color: #fff;
            border-radius: 4px;
            outline: none;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
            background: #ff0000;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
        }

        button:hover { background: #cc0000; }

        .video-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <!-- 隱形觸發區：滑鼠移到最上方時顯示輸入框 -->
    <div class="hover-trigger" onmouseover="showControls()"></div>

    <div class="controls" id="controlBar">
        <input type="text" id="videoUrl" placeholder="在此貼上 YouTube 連結並按下 Enter...">
        <button onclick="playVideo()">播放</button>
    </div>

    <div class="video-wrapper">
        <iframe id="player" src="" allow="autoplay; encrypted-media" allowfullscreen></iframe>
    </div>

    <script>
        const controlBar = document.getElementById('controlBar');
        const urlInput = document.getElementById('videoUrl');

        function playVideo() {
            const videoId = extractVideoID(urlInput.value);

            if (videoId) {
                const player = document.getElementById('player');
                // 加入參數：autoplay(自動播放), modestbranding(簡約標誌), iv_load_policy(關閉註解), rel(關聯影片)
                player.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&modestbranding=1&iv_load_policy=3&rel=0`;
                
                // 播放後縮起輸入欄
                hideControls();
            } else {
                alert("網址格式不正確！");
            }
        }

        function hideControls() {
            controlBar.classList.add('hidden');
        }

        function showControls() {
            controlBar.classList.remove('hidden');
        }

        function extractVideoID(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        urlInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') playVideo();
        });
    </script>

</body>
</html>
