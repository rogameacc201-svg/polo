<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>賓果賓果即時開獎監測</title>
    <style>
        :root {
            --primary-color: #003366;
            --accent-color: #ffcc00;
        }
        body {
            font-family: "Microsoft JhengHei", Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 900px;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        h2 { color: var(--primary-color); margin: 0; font-size: 24px; }
        .status-box { text-align: right; }
        #timer { font-weight: bold; color: #e74c3c; font-size: 20px; }
        
        /* 表格樣式修正 */
        #data-container {
            overflow-x: auto;
            min-height: 300px;
        }
        table {
            width: 100% !important;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 10px;
            border: 1px solid #ddd;
            text-align: center;
        }
        /* 修正該網站圖片顯示 */
        img {
            max-width: 30px;
            height: auto;
            vertical-align: middle;
        }
        .loading {
            text-align: center;
            padding: 50px;
            font-size: 18px;
            color: #666;
        }
        .error-msg {
            color: #d9534f;
            background: #fdf7f7;
            padding: 15px;
            border-radius: 5px;
            border: 1px solid #d9534f;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>賓果賓果即時監測</h2>
        <div class="status-box">
            更新倒數：<span id="timer">60</span> 秒
        </div>
    </div>

    <div id="data-container">
        <div class="loading">正在連線至開獎伺服器，請稍候...</div>
    </div>

    <p style="font-size: 12px; color: #999; margin-top: 15px;">
        * 資料來源：pilio.idv.tw | 本頁面每 60 秒自動抓取最新數據。
    </p>
</div>

<script>
    let countdown = 60;
    const timerDisplay = document.getElementById('timer');
    const dataContainer = document.getElementById('data-container');

    // 核心抓取函式
    async function fetchBingoData() {
        // 使用 corsproxy.io 解決跨網域問題
        const targetUrl = "https://www.pilio.idv.tw/bingo/list.asp?auto=1";
        const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`;

        try {
            const response = await fetch(proxyUrl);
            if (!response.ok) throw new Error('無法取得遠端資料');

            // 處理 Big5 編碼 (防止亂碼)
            const arrayBuffer = await response.arrayBuffer();
            const decoder = new TextDecoder('big5');
            const htmlText = decoder.decode(arrayBuffer);

            const parser = new DOMParser();
            const doc = parser.parseFromString(htmlText, 'text/html');

            // 抓取頁面中主要的 table (根據該站結構，抓取包含「期別」字眼的表格)
            const tables = doc.querySelectorAll('table');
            let bingoTable = null;

            tables.forEach(t => {
                if (t.innerText.includes('期別') || t.innerText.includes('開獎號碼')) {
                    bingoTable = t;
                }
            });

            if (bingoTable) {
                // 修正圖片路徑：將相對路徑轉為絕對路徑
                const imgs = bingoTable.querySelectorAll('img');
                imgs.forEach(img => {
                    const src = img.getAttribute('src');
                    if (src && !src.startsWith('http')) {
                        img.src = "https://www.pilio.idv.tw/bingo/" + src;
                    }
                });

                // 移除原站不必要的連結
                const links = bingoTable.querySelectorAll('a');
                links.forEach(a => a.removeAttribute('href'));

                // 渲染至頁面
                dataContainer.innerHTML = bingoTable.outerHTML;
            } else {
                dataContainer.innerHTML = "<div class='error-msg'>找不到資料表格，可能網站結構已更動。</div>";
            }

        } catch (error) {
            console.error(error);
            dataContainer.innerHTML = `<div class='error-msg'>抓取失敗：${error.message}<br>請確認網路連線或稍後再試。</div>`;
        }
    }

    // 倒數計時器邏輯
    function startTimer() {
        setInterval(() => {
            countdown--;
            timerDisplay.innerText = countdown;

            if (countdown <= 0) {
                countdown = 60;
                fetchBingoData();
            }
        }, 1000);
    }

    // 初始化執行
    fetchBingoData();
    startTimer();
</script>

</body>
</html>
