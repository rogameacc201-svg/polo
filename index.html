<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>Bingo Bingo 快速看板</title>
    <style>
        body { font-family: sans-serif; background: #111827; color: white; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .box { background: #1f2937; border-radius: 15px; padding: 20px; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        h2 { color: #fbbf24; margin-bottom: 5px; }
        .time { color: #9ca3af; font-size: 12px; margin-bottom: 20px; }
        .balls { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
        .ball { width: 45px; height: 45px; line-height: 45px; background: #ef4444; border-radius: 50%; font-weight: bold; font-size: 18px; box-shadow: inset -2px -2px 5px rgba(0,0,0,0.3); }
        .ball.blue { background: #3b82f6; }
        .msg { margin-top: 15px; color: #60a5fa; font-size: 14px; min-height: 20px; }
        button { margin-top: 15px; padding: 8px 20px; border-radius: 5px; border: none; cursor: pointer; background: #374151; color: white; }
    </style>
</head>
<body>

<div class="box">
    <h2>BINGO BINGO 號碼</h2>
    <div id="time" class="time">連線中...</div>
    <div id="balls" class="balls"></div>
    <div id="msg" class="msg">正在取得最新獎號...</div>
    <button onclick="update()">點擊更新</button>
</div>

<script>
    async function update() {
        const msg = document.getElementById('msg');
        const balls = document.getElementById('balls');
        const time = document.getElementById('time');
        
        msg.innerText = "讀取中...";
        
        // 使用一個較少被封鎖的公共 API 來源，抓取開獎彙整網
        // 這裡抓取一個結構極簡的備用來源
        const proxy = "https://api.allorigins.win/get?url=";
        const target = encodeURIComponent("https://www.lotto-8.com/list_bingobingo.asp");

        try {
            const res = await fetch(proxy + target);
            const data = await res.json();
            const html = data.contents;
            
            // 抓取號碼 (ball_red 標籤內的兩位數字)
            const regex = /ball_red">(\d{2})<\/td>/g;
            let match;
            let nums = [];
            
            while ((match = regex.exec(html)) !== null) {
                nums.push(match[1]);
                if (nums.length >= 20) break;
            }

            // 抓取超級獎號
            const superMatch = /ball_blue">(\d{2})<\/td>/.exec(html);
            if (superMatch) nums.push(superMatch[1]);

            if (nums.length > 0) {
                balls.innerHTML = '';
                nums.forEach((n, i) => {
                    const div = document.createElement('div');
                    div.className = i === 20 ? 'ball blue' : 'ball';
                    div.innerText = n;
                    balls.appendChild(div);
                });
                msg.innerText = "更新成功！";
                time.innerText = "資料來源時間：" + new Date().toLocaleTimeString();
            } else {
                msg.innerText = "目前網站維護中，請稍後重試。";
            }
        } catch (e) {
            msg.innerText = "連線失敗，請檢查網路。";
        }
    }

    // 初始化與每分鐘自動更新
    update();
    setInterval(update, 60000);
</script>

</body>
</html>
