<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>台股熱門榜 - 暴力穿透版</title>
    <style>
        :root { --bg: #0d1117; --card: #161b22; --border: #30363d; --primary: #58a6ff; --up: #f85149; --down: #3fb950; --text: #c9d1d9; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .header { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 25px; text-align: center; margin-bottom: 25px; width: 100%; max-width: 900px; }
        .btn { background: #238636; color: white; border: none; padding: 15px 40px; border-radius: 8px; font-size: 1.1rem; cursor: pointer; font-weight: bold; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; width: 100%; max-width: 1200px; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 20px; border-left: 6px solid #444; }
        .price { font-size: 2.2rem; font-weight: 900; margin: 8px 0; }
    </style>
</head>
<body>

<div class="header">
    <h1>🚀 台股即時掃描雷達</h1>
    <p>暴力穿透模式 (已內建保底資料邏輯)</p>
    <button class="btn" onclick="fetchData()">⚡ 執行動態掃描</button>
    <div id="status" style="margin-top:15px; color:#8b949e;">系統準備就緒</div>
</div>

<div id="results" class="grid"></div>

<script>
    // ⚠️ 請換成你最新部署的 GAS 網址
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzsCJDJ7-3HzrfkjHIf2zUdQK8JF9GUzWVD7_t0sC9_W1A9zlQ8VguxKWzbb5SU6Bl1/exec";

    async function fetchData() {
        if (GAS_URL.includes("你的")) return alert("請先填入 GAS 網址");
        
        const results = document.getElementById('results');
        const status = document.getElementById('status');
        results.innerHTML = "";
        status.innerText = "⏳ 正在啟動連線...";

        try {
            // 加入隨機參數 t 防止瀏覽器抓舊資料
            const response = await fetch(GAS_URL + "?t=" + Date.now());
            const data = await response.json();
            const list = data.result || [];

            list.forEach(s => {
                const change = s.change || 0;
                const isUp = change >= 0;
                const color = isUp ? "var(--up)" : "var(--down)";
                
                const card = document.createElement('div');
                card.className = "card";
                card.style.borderLeftColor = color;
                card.innerHTML = `
                    <div style="display:flex; justify-content:space-between">
                        <b style="color:var(--primary); font-size:1.2rem">${s.symbol}</b>
                        <span style="font-weight:bold">${s.name}</span>
                    </div>
                    <div class="price" style="color:${color}">
                        ${(s.price || 0).toFixed(2)}
                        <span style="font-size:1.1rem">${isUp ? '▲' : '▼'}${Math.abs(change).toFixed(2)}%</span>
                    </div>
                    <div style="font-size:0.85rem; color:#8b949e; border-top:1px solid #333; padding-top:8px; margin-top:10px">
                        成交量：${s.vol ? s.vol.toLocaleString() + ' 張' : '--'}
                    </div>
                `;
                results.appendChild(card);
            });
            status.innerText = `✅ 獲取成功 (${new Date().toLocaleTimeString()})`;
        } catch (err) {
            status.innerText = "❌ 連線失敗，請檢查網路或 GAS 網址";
        }
    }
</script>

</body>
</html>
