<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台股即時強勢雷達 - 穿透封鎖版</title>
    <style>
        :root { --bg: #0d1117; --card: #161b22; --border: #30363d; --primary: #58a6ff; --up: #f85149; --down: #3fb950; }
        body { font-family: -apple-system, system-ui, sans-serif; background: var(--bg); color: #c9d1d9; padding: 20px; }
        .header { background: var(--card); padding: 25px; border-radius: 12px; border: 1px solid var(--border); text-align: center; margin-bottom: 25px; }
        .btn-scan { background: #238636; color: white; border: none; padding: 14px 40px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 1.1rem; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 18px; border-left: 5px solid transparent; }
        .is-up { border-left-color: var(--up); }
        .is-down { border-left-color: var(--down); }
        .price { font-size: 2.2rem; font-weight: 800; margin: 10px 0; }
        #debug-box { background: #000; color: #0f0; padding: 15px; font-size: 12px; margin-top: 15px; display: none; text-align: left; border: 1px solid #444; }
    </style>
</head>
<body>

<div class="header">
    <h1>📈 即時熱門台股掃描</h1>
    <p>使用客戶端穿透技術，直接抓取即時標的</p>
    <button class="btn-scan" onclick="smartScan()">⚡ 執行動態掃描</button>
    <div id="status" style="margin-top:15px; color:#8b949e;">準備就緒</div>
    <div id="debug-box"></div>
</div>

<div id="results" class="grid"></div>

<script>
    // 這次改用更開放的代理服務，繞過 Google Script 被封鎖的 IP
    const proxy = (url) => `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`;

    async function smartScan() {
        const results = document.getElementById('results');
        const status = document.getElementById('status');
        const debugBox = document.getElementById('debug-box');
        
        results.innerHTML = "";
        debugBox.innerHTML = "";
        status.innerText = "⏳ 正在穿透 Yahoo 封鎖層...";

        try {
            // 第一步：直接抓取 Yahoo 台股熱門榜單頁面內容 (不走 API，走 HTML 抓取)
            const targetUrl = "https://tw.stock.yahoo.com/rank/volume?e=tse"; 
            const res = await fetch(proxy(targetUrl));
            const data = await res.json();
            const html = data.contents;

            // 用正規表達式從 HTML 中挖出股票代碼 (找 4 碼數字)
            const regex = /"symbol":"(\d{4})\.TW"/g;
            let match;
            const symbols = new Set();
            while ((match = regex.exec(html)) !== null) {
                if (symbols.size < 20) symbols.add(`${match[1]}.TW`);
            }

            if (symbols.size === 0) {
                // 如果正則失敗，手動補入熱門權值作為保底
                ["2330.TW","2317.TW","2454.TW","2382.TW","3231.TW","2603.TW","1513.TW","3017.TW"].forEach(s => symbols.add(s));
            }

            const symbolList = Array.from(symbols).join(',');
            status.innerText = `🔍 偵測到熱門標的：${symbolList}，正在獲取報價...`;

            // 第二步：獲取即時報價 (改用 V8 接口，這對穿透代理更友善)
            const quoteUrl = `https://query1.finance.yahoo.com/v7/finance/quote?symbols=${symbolList}`;
            const quoteRes = await fetch(proxy(quoteUrl));
            const quoteDataRaw = await quoteRes.json();
            const quoteData = JSON.parse(quoteDataRaw.contents);

            const list = quoteData.quoteResponse.result;

            list.forEach(s => {
                const change = s.regularMarketChangePercent || 0;
                const isUp = change >= 0;
                const card = document.createElement('div');
                card.className = `card ${isUp ? 'is-up' : 'is-down'}`;
                card.innerHTML = `
                    <div style="display:flex; justify-content:space-between">
                        <span style="color:var(--primary); font-weight:bold; font-size:1.2rem">${(s.symbol || "").split('.')[0]}</span>
                        <span style="font-size:0.9rem; color:#8b949e">${s.shortName || ''}</span>
                    </div>
                    <div class="price" style="color: ${isUp ? 'var(--up)' : 'var(--down)'}">
                        ${(s.regularMarketPrice || 0).toFixed(2)}
                        <span style="font-size:1.2rem">${isUp ? '▲' : '▼'}${Math.abs(change).toFixed(2)}%</span>
                    </div>
                    <div style="font-size:0.85rem; color:#8b949e; border-top:1px solid #333; padding-top:8px">
                        成交量：${Math.floor((s.regularMarketVolume || 0) / 1000)} 張
                    </div>
                `;
                results.appendChild(card);
            });

            status.innerText = `✅ 掃描完成！資料時間：${new Date().toLocaleTimeString()}`;

        } catch (err) {
            status.innerText = "❌ 掃描失敗";
            debugBox.style.display = "block";
            debugBox.innerText = "失敗詳情：" + err.message;
        }
    }
</script>

</body>
</html>
