<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>台股熱門榜 - 鉅亨數據版</title>
    <style>
        :root { --bg: #0d1117; --card: #161b22; --border: #30363d; --primary: #58a6ff; --up: #f85149; --down: #3fb950; --text: #c9d1d9; }
        body { font-family: sans-serif; background: var(--bg); color: var(--text); padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .header { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 30px; text-align: center; margin-bottom: 25px; width: 100%; max-width: 800px; }
        .btn-scan { background: #238636; color: white; border: none; padding: 15px 40px; border-radius: 8px; font-size: 1.2rem; cursor: pointer; font-weight: bold; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; width: 100%; max-width: 1200px; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 20px; border-left: 6px solid #444; }
        .price { font-size: 2.2rem; font-weight: 900; margin: 10px 0; }
    </style>
</head>
<body>

<div class="header">
    <h1>🔥 台股熱門成交排行</h1>
    <p>使用鉅亨網備援接口 (避開證交所封鎖)</p>
    <button class="btn-scan" id="btn">⚡ 執行掃描</button>
    <div id="status" style="margin-top:15px; color:#8b949e;">準備就緒</div>
</div>

<div id="results" class="grid"></div>

<script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbyTct7daDOxASirHANNRDsTsqt1jv6iipSXacaoVGI4_UeipcRUVMHMDPMUX9JgA6lC/exec"; // ⚠️ 請更換

    document.getElementById('btn').addEventListener('click', async () => {
        const results = document.getElementById('results');
        const status = document.getElementById('status');
        results.innerHTML = "";
        status.innerText = "⏳ 正在請求數據...";

        try {
            const response = await fetch(GAS_URL + "?t=" + Date.now());
            const data = await response.json();
            const list = data.result || [];

            list.forEach(s => {
                const isUp = s.change >= 0;
                const color = isUp ? "var(--up)" : "var(--down)";
                const card = document.createElement('div');
                card.className = "card";
                card.style.borderLeftColor = color;
                card.innerHTML = `
                    <div style="display:flex; justify-content:space-between">
                        <b style="color:var(--primary); font-size:1.2rem">${s.symbol}</b>
                        <span>${s.shortName}</span>
                    </div>
                    <div class="price" style="color:${color}">
                        ${(s.price || 0).toFixed(2)}
                        <span style="font-size:1rem">${isUp ? '▲' : '▼'}${Math.abs(s.change).toFixed(2)}%</span>
                    </div>
                    <div style="font-size:0.85rem; color:#8b949e">成交量：${Math.floor(s.vol).toLocaleString()}</div>
                `;
                results.appendChild(card);
            });
            status.innerText = "✅ 更新成功";
        } catch (err) {
            status.innerText = "❌ 連線失敗";
            console.error(err);
        }
    });
</script>

</body>
</html>
