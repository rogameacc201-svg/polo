<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台股即時強勢雷達 - 穿透版</title>
    <style>
        :root { --bg: #0d1117; --card: #161b22; --border: #30363d; --primary: #58a6ff; --up: #f85149; --down: #3fb950; }
        body { font-family: sans-serif; background: var(--bg); color: #c9d1d9; padding: 20px; }
        .header { background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid var(--border); text-align: center; margin-bottom: 20px; }
        .btn-scan { background: #238636; color: white; border: none; padding: 12px 30px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 15px; }
        .price-up { color: var(--up); font-size: 1.8rem; font-weight: bold; }
        .price-down { color: var(--down); font-size: 1.8rem; font-weight: bold; }
        #debug { background: #000; color: #0f0; padding: 10px; font-size: 11px; margin-top: 10px; display: none; white-space: pre-wrap; }
    </style>
</head>
<body>

<div class="header">
    <h1>📈 即時熱門台股掃描</h1>
    <p>自動從搜尋引擎抓取當前最受關注的標的</p>
    <button class="btn-scan" onclick="smartScan()">⚡ 執行穿透掃描</button>
    <div id="status" style="margin-top:10px; color:#8b949e;">準備就緒</div>
    <div id="debug"></div>
</div>

<div id="results" class="grid"></div>

<script>
    // 請確認你的 GAS 已經更新並重新發布
    const myProxy = "https://script.google.com/macros/s/AKfycbzomDPhtm28NHi8s4tWhwZJ90p4Gg0XVgyQ4xR1KtiW2satBLblV5peSngnEo6QdakN/exec";

    async function smartScan() {
        const results = document.getElementById('results');
        const status = document.getElementById('status');
        const debug = document.getElementById('debug');
        
        results.innerHTML = "";
        status.innerText = "⏳ 正在模擬搜尋請求...";

        try {
            // 策略：搜尋 ".TW" 關鍵字，Yahoo 會回傳目前權重最高、最熱門的台灣股票
            const searchTarget = `https://query1.finance.yahoo.com/v1/finance/search?q=.TW&quotesCount=20&newsCount=0`;
            const searchUrl = `${myProxy}?url=${encodeURIComponent(searchTarget)}`;
            
            const searchRes = await fetch(searchUrl);
            const searchData = JSON.parse(await searchRes.text());
            
            // 取得搜尋到的代碼清單
            const foundQuotes = searchData.quotes || [];
            if (foundQuotes.length === 0) throw new Error("搜尋不到任何股票代碼");

            const symbols = foundQuotes.map(q => q.symbol).join(',');
            status.innerText = `🔍 已偵測到 ${foundQuotes.length} 檔動態標的，抓取報價中...`;

            // 取得這些代碼的即時報價
            const quoteTarget = `https://query1.finance.yahoo.com/v7/finance/quote?symbols=${symbols}`;
            const quoteUrl = `${myProxy}?url=${encodeURIComponent(quoteTarget)}`;
            
            const quoteRes = await fetch(quoteUrl);
            const quoteData = JSON.parse(await quoteRes.text());
            const list = quoteData.quoteResponse.result || [];

            list.forEach(s => {
                const change = s.regularMarketChangePercent || 0;
                const isUp = change >= 0;
                const card = document.createElement('div');
                card.className = "card";
                card.innerHTML = `
                    <div style="display:flex; justify-content:space-between">
                        <span style="color:var(--primary); font-weight:bold">${s.symbol.split('.')[0]}</span>
                        <span style="font-size:0.8rem; color:#8b949e">${s.shortName || ''}</span>
                    </div>
                    <div class="${isUp ? 'price-up' : 'price-down'}">
                        ${(s.regularMarketPrice || 0).toFixed(2)}
                        <span style="font-size:1rem">${isUp ? '▲' : '▼'}${Math.abs(change).toFixed(2)}%</span>
                    </div>
                    <div style="font-size:0.8rem; color:#8b949e; margin-top:10px; border-top:1px solid #333; padding-top:5px">
                        成交量：${Math.floor((s.regularMarketVolume || 0) / 1000)} 張
                    </div>
                `;
                results.appendChild(card);
            });

            status.innerText = `✅ 已成功抓取最新動態標的 (${new Date().toLocaleTimeString()})`;

        } catch (err) {
            status.innerText = "❌ 穿透掃描失敗";
            debug.style.display = "block";
            debug.innerText = "失敗原因：" + err.message;
        }
    }
</script>

</body>
</html>
