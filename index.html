<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>台股即時強勢掃描儀 - 穩定版</title>
    <style>
        :root { --bg: #0b0e14; --card: #1c2128; --up: #f23645; --down: #089981; --accent: #2962ff; }
        body { font-family: "Microsoft JhengHei", sans-serif; background: var(--bg); color: #d1d4dc; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        header { background: var(--card); padding: 25px; border-radius: 15px; text-align: center; margin-bottom: 25px; border: 1px solid #30363d; }
        .btn-run { background: var(--accent); color: white; border: none; padding: 15px 40px; border-radius: 8px; font-size: 1.2rem; cursor: pointer; transition: 0.3s; }
        .btn-run:hover { background: #1e4bd8; transform: translateY(-2px); }
        .status { margin-top: 15px; font-size: 0.9rem; color: #8b949e; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
        .card { background: var(--card); border-radius: 12px; padding: 20px; border: 1px solid #30363d; animation: fadeIn 0.5s; }
        .card:hover { border-color: var(--accent); }
        .row { display: flex; justify-content: space-between; align-items: center; margin: 10px 0; }
        .price { font-size: 1.8rem; font-weight: bold; color: #fff; }
        .change { font-weight: bold; font-size: 1.1rem; }
        .tag { background: rgba(41, 98, 255, 0.1); color: var(--accent); padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; }
        .news-btn { display: block; text-align: center; background: #30363d; color: #fff; text-decoration: none; padding: 10px; border-radius: 6px; margin-top: 15px; font-size: 0.9rem; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>📈 台股即時強勢掃描儀</h1>
        <p>系統將即時分析 300 檔熱門股的量價趨勢</p>
        <button class="btn-run" onclick="runAnalysis()">🚀 開始全自動掃描</button>
        <div id="status" class="status">點擊按鈕開始分析當下盤勢...</div>
    </header>
    <div id="results" class="grid"></div>
</div>

<script>
// 精選台股 300 檔高成交量標的 (涵蓋 0050, 0051 及熱門中小型)
const stockPool = [
    
];

async function runAnalysis() {
    const results = document.getElementById('results');
    const status = document.getElementById('status');
    results.innerHTML = '';
    
    status.innerText = "🚀 正在啟動即時數據引擎，掃描 300 檔標的中...";

    let candidates = [];
    const proxy = "https://api.allorigins.win/get?url="; // 保留但優化報錯處理

    // 分批處理請求，避免瀏覽器崩潰
    const batchSize = 15;
    for (let i = 0; i < stockPool.length; i += batchSize) {
        const batch = stockPool.slice(i, i + batchSize);
        status.innerText = `正在分析盤勢：${i}/${stockPool.length}...`;
        
        const promises = batch.map(async (id) => {
            try {
                const ticker = id + ".TW";
                const url = `https://query1.finance.yahoo.com/v8/finance/chart/${ticker}?range=1mo&interval=1d`;
                const response = await fetch(`${proxy}${encodeURIComponent(url)}`);
                const json = await response.json();
                const data = JSON.parse(json.contents);
                
                const result = data.chart.result[0];
                const close = result.indicators.adjclose[0].adjclose;
                const vol = result.indicators.quote[0].volume;

                if (close.length < 20) return;

                const ma = (arr, n) => arr.slice(-n).reduce((a, b) => a + b) / n;
                const m5 = ma(close, 5);
                const m10 = ma(close, 10);
                const m20 = ma(close, 20);
                const v5 = ma(vol, 5);

                const nowPrice = close[close.length - 1];
                const change = ((nowPrice - close[close.length - 2]) / close[close.length - 2]) * 100;
                const volRatio = vol[vol.length - 1] / v5;

                // 選股策略：多頭排列 + 帶量
                if (m5 > m10 && m10 > m20 && volRatio > 1.2) {
                    candidates.push({
                        id, price: nowPrice.toFixed(2), 
                        change: change.toFixed(2), 
                        volRatio: volRatio.toFixed(2),
                        score: (change * 1.5 + volRatio * 2).toFixed(1)
                    });
                }
            } catch (e) {}
        });

        await Promise.all(promises);
        // 稍微等待，防止代理伺服器拒絕連線
        await new Promise(r => setTimeout(r, 200));
    }

    candidates.sort((a, b) => b.score - a.score);
    status.innerText = `✅ 掃描完成！發現 ${candidates.length} 檔技術面強勢標的。`;

    candidates.forEach(s => {
        results.innerHTML += `
            <div class="card">
                <div class="row"><span class="tag">AI 評分 ${s.score}</span><span>${s.id}</span></div>
                <div class="row">
                    <span class="price">${s.price}</span>
                    <span class="change" style="color:${s.change >= 0 ? 'var(--up)' : 'var(--down)'}">
                        ${s.change >= 0 ? '+' : ''}${s.change}%
                    </span>
                </div>
                <div class="row" style="font-size:0.85rem">
                    <span>量能爆發：${s.volRatio}x</span>
                    <span style="color:#10b981">● 多頭排列</span>
                </div>
                <a class="news-btn" target="_blank" href="https://www.google.com/search?q=${s.id}+新聞&tbm=nws">🔍 查看即時新聞走向</a>
            </div>
        `;
    });
}
</script>

</body>
</html>
