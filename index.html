<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>簡易 YouTube 播放器</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .input-group { margin-bottom: 20px; }
        input { padding: 10px; width: 300px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px 20px; cursor: pointer; background: #ff0000; color: white; border: none; border-radius: 4px; }
        .video-container { width: 100%; max-width: 800px; aspect-ratio: 16 / 9; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <h2>我的網頁播放器</h2>

    <div class="input-group">
        <input type="text" id="videoUrl" placeholder="請貼上 YouTube 影片連結...">
        <button onclick="playVideo()">播放影片</button>
    </div>

    <div class="video-container">
        <!-- 播放器會顯示在這裡 -->
        <iframe id="player" src="" allowfullscreen></iframe>
    </div>

    <script>
        function playVideo() {
            const urlInput = document.getElementById('videoUrl').value;
            const videoId = extractVideoID(urlInput);

            if (videoId) {
                const player = document.getElementById('player');
                // 更新 iframe 的來源網址
                player.src = `https://www.youtube.com/embed/${videoId}?autoplay=1`;
            } else {
                alert("請輸入有效的 YouTube 網址");
            }
        }

        // 解析網址以獲取影片 ID 的函式
        function extractVideoID(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }
    </script>

</body>
</html>
