<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>台股即時監測 - 穩定連線版</title>
    <style>
        :root { --bg: #0d1117; --card: #161b22; --border: #30363d; --tw-red: #f85149; --tw-green: #3fb950; --accent: #58a6ff; }
        body { font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; background: var(--bg); color: #c9d1d9; padding: 20px; }
        .container { max-width: 1100px; margin: 0 auto; }
        .header-box { background: var(--card); padding: 30px; border-radius: 12px; border: 1px solid var(--border); text-align: center; margin-bottom: 20px; }
        .btn-scan { background: #238636; color: white; border: none; padding: 16px 40px; border-radius: 8px; font-size: 1.2rem; font-weight: bold; cursor: pointer; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 20px; }
        .stock-id { color: var(--accent); font-size: 1.5rem; font-weight: bold; }
        .price-area { margin: 15px 0; font-size: 2rem; font-weight: bold; }
        .change-tag { font-size: 1rem; padding: 2px 8px; border-radius: 4px; margin-left: 10px; }
        .tag-up { background: rgba(248, 81, 73, 0.15); color: var(--tw-red); }
        .tag-down { background: rgba(63, 185, 80, 0.15); color: var(--tw-green); }
        .status { margin-top: 15px; color: #8b949e; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-box">
        <h1>🇹🇼 台股即時熱門雷達</h1>
        <p>直接連動台股交易資料庫，獲取即時成交資訊</p>
        <button class="btn-scan" onclick="startScanner()">🚀 重新載入即時榜單</button>
        <div id="status" class="status">準備就緒</div>
    </div>
    <div id="results" class="grid"></div>
</div>

<script>
const myProxy = "https://script.google.com/macros/s/AKfycbyZr1LgjVdnm-jBQXeXg1mwIn3IwnI0L8qo6gsfTlgVFDhMIwdy6pqNKqxs5TUqlOE/exec";

async function startScanner() {
    const results = document.getElementById('results');
    const status = document.getElementById('status');
    results.innerHTML = '';
    status.innerText = "🌐 正在從台股資料庫檢索即時數據...";

    try {
        // 使用特定的篩選器 ID：day_gainers_taiwan 或 most_actives
        // 這裡嘗試抓取成交量最活耀的標的
        const hotUrl = "https://query2.finance.yahoo.com/v1/finance/screener/predefined/saved?formatted=false&scrIds=day_gainers_taiwan&count=50";
        
        const response = await fetch(`${myProxy}?url=${encodeURIComponent(hotUrl)}`);
        const rawData = await response.json();
        
        const activeStocks = rawData.finance.result[0].quotes;

        if(!activeStocks || activeStocks.length === 0) {
            // 如果 day_gainers 沒資料，換一個備用接口（熱門榜）
            status.innerText = "🔄 切換至備用掃描頻道...";
            const backupUrl = "https://query2.finance.yahoo.com/v1/finance/screener/predefined/saved?formatted=false&scrIds=most_actives&count=100";
            const bRes = await fetch(`${myProxy}?url=${encodeURIComponent(backupUrl)}`);
            const bData = await bRes.json();
            const filtered = bData.finance.result[0].quotes.filter(q => q.symbol.endsWith('.TW') || q.symbol.endsWith('.TWO'));
            renderStocks(filtered);
        } else {
            renderStocks(activeStocks);
        }

    } catch (err) {
        status.innerText = "❌ 連線異常，請確認私人通道部署狀態。";
    }
}

function renderStocks(stocks) {
    const results = document.getElementById('results');
    const status = document.getElementById('status');
    
    if(!stocks || stocks.length === 0) {
        status.innerText = "⚠️ 暫無數據，請確認此時是否為交易時間。";
        return;
    }

    status.innerText = `✅ 成功獲取 ${stocks.length} 檔即時標的。`;
    
    stocks.forEach(stock => {
        const isUp = stock.regularMarketChangePercent >= 0;
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
            <div>
                <span class="stock-id">${stock.symbol.split('.')[0]}</span>
                <span style="color:#8b949e; font-size:0.9rem; margin-left:8px;">${stock.shortName || ''}</span>
            </div>
            <div class="price-area" style="color: ${isUp ? 'var(--tw-red)' : 'var(--tw-green)'}">
                ${(stock.regularMarketPrice || 0).toFixed(2)}
                <span class="change-tag ${isUp ? 'tag-up' : 'tag-down'}">
                    ${isUp ? '▲' : '▼'} ${Math.abs(stock.regularMarketChangePercent || 0).toFixed(2)}%
                </span>
            </div>
            <div style="font-size:0.85rem; color:#8b949e;">
                成交量：${formatVol(stock.regularMarketVolume)}
            </div>
        `;
        results.appendChild(card);
    });
}

function formatVol(vol) {
    if (!vol) return "---";
    return vol > 10000 ? (vol / 1000).toFixed(0) + " 張" : vol;
}
</script>
</body>
</html>
