<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>台股即時熱門 AI 掃描儀 (免插件版)</title>
    <style>
        :root { --bg: #0b0e14; --card: #151921; --primary: #3b82f6; --up: #f23645; --down: #089981; }
        body { font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; background: var(--bg); color: #d1d4dc; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .header { background: var(--card); padding: 30px; border-radius: 16px; text-align: center; border: 1px solid #2a2e39; margin-bottom: 20px; }
        .btn-live { background: linear-gradient(135deg, #00c853, #009624); color: white; border: none; padding: 16px 32px; border-radius: 50px; font-size: 1.2rem; font-weight: bold; cursor: pointer; box-shadow: 0 4px 15px rgba(0,200,83,0.3); transition: 0.3s; }
        .btn-live:hover { transform: scale(1.05); filter: brightness(1.1); }
        .loader { display: none; margin: 20px auto; border: 4px solid #2a2e39; border-top: 4px solid #00c853; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .card { background: var(--card); border-radius: 12px; padding: 20px; border: 1px solid #2a2e39; position: relative; }
        .price-row { display: flex; justify-content: space-between; align-items: center; margin: 15px 0; }
        .price { font-size: 1.8rem; font-weight: bold; color: #fff; }
        .change { font-size: 1.1rem; font-weight: bold; }
        .indicator { background: #1c2128; padding: 12px; border-radius: 8px; font-size: 0.85rem; border-left: 4px solid var(--primary); }
        .links { margin-top: 15px; display: flex; gap: 8px; }
        .link { flex: 1; text-align: center; padding: 8px; border-radius: 6px; background: #2a2e39; color: #fff; text-decoration: none; font-size: 0.75rem; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>📡 實時熱門股 AI 自動分析</h1>
        <p>系統會自動抓取台股當下成交量排行，並計算 5/10/20MA 趨勢</p>
        <button class="btn-live" onclick="scanMarket()">🚀 立即連線抓取並分析</button>
        <div id="loader" class="loader"></div>
        <p id="status" style="margin-top:15px; color: #848e9c;"></p>
    </div>
    <div id="results" class="grid"></div>
</div>

<script>
// 使用代理伺服器繞過 CORS 限制
const proxy = "https://api.allorigins.win/get?url=";

async function fetchData(url) {
    const response = await fetch(`${proxy}${encodeURIComponent(url)}`);
    const data = await response.json();
    return JSON.parse(data.contents);
}

async function scanMarket() {
    const results = document.getElementById('results');
    const loader = document.getElementById('loader');
    const status = document.getElementById('status');
    
    results.innerHTML = '';
    loader.style.display = 'block';
    status.innerText = "正在連線到市場 API (經由代理伺服器)...";

    try {
        // 1. 抓取最即時的熱門股名單 (Yahoo 官方熱門榜單)
        const hotUrl = "https://query2.finance.yahoo.com/v1/finance/screener/predefined/saved?formatted=false&scrIds=most_actives&count=40";
        const hotData = await fetchData(hotUrl);
        
        const activeStocks = hotData.finance.result[0].quotes
            .filter(q => q.symbol.endsWith('.TW') || q.symbol.endsWith('.TWO'))
            .map(q => q.symbol);

        if (activeStocks.length === 0) throw new Error("未能抓取到熱門股");

        status.innerText = `已成功連線！分析中 (${activeStocks.length} 檔)...`;

        let candidates = [];

        // 2. 深度分析每一檔即時熱門標的
        for (let ticker of activeStocks) {
            try {
                const chartUrl = `https://query1.finance.yahoo.com/v8/finance/chart/${ticker}?range=1mo&interval=1d`;
                const data = await fetchData(chartUrl);
                const quote = data.chart.result[0].indicators.quote[0];
                const close = data.chart.result[0].indicators.adjclose[0].adjclose;
                const vol = quote.volume;

                if (close.length < 20) continue;

                const ma = (arr, n) => arr.slice(-n).reduce((a, b) => a + b) / n;
                const m5 = ma(close, 5);
                const m10 = ma(close, 10);
                const m20 = ma(close, 20);
                const v5 = ma(vol, 5);

                const currentPrice = close[close.length - 1];
                const prevPrice = close[close.length - 2];
                const currentVol = vol[vol.length - 1];
                const change = ((currentPrice - prevPrice) / prevPrice) * 100;
                const volRatio = currentVol / v5;

                // 篩選邏輯：站上5日線且多頭排列，成交量需大於5日均量
                if (currentPrice > m5 && m5 > m10 && volRatio > 1.1) {
                    candidates.push({
                        symbol: ticker.split('.')[0],
                        price: currentPrice.toFixed(2),
                        change: change.toFixed(2),
                        volRatio: volRatio.toFixed(2),
                        score: (change * 2 + volRatio * 1.5).toFixed(1)
                    });
                }
            } catch (e) { console.warn(`跳過 ${ticker}`); }
        }

        loader.style.display = 'none';
        candidates.sort((a, b) => b.score - a.score);

        if (candidates.length === 0) {
            status.innerText = "完成。今日熱門股多處於回檔或整理期。";
        } else {
            status.innerText = `完成！挑選出 ${candidates.length} 檔技術面強勢標的。`;
            candidates.forEach(s => {
                results.innerHTML += `
                    <div class="card">
                        <div style="font-size: 1.4rem; font-weight: bold; color:#fff;">${s.symbol}</div>
                        <div class="price-row">
                            <div class="price">${s.price}</div>
                            <div class="change" style="color:${s.change >= 0 ? 'var(--up)' : 'var(--down)'}">
                                ${s.change >= 0 ? '+' : ''}${s.change}%
                            </div>
                        </div>
                        <div class="indicator">
                            🔥 量能比：${s.volRatio}x (主力介入量)<br>
                            📈 趨勢：5/10/20MA 多頭起漲
                        </div>
                        <div class="links">
                            <a class="link" target="_blank" href="https://www.google.com/search?q=${s.symbol}+新聞&tbm=nws">📰 新聞</a>
                            <a class="link" target="_blank" href="https://tw.stock.yahoo.com/quote/${s.symbol}.TW">📊 報價</a>
                        </div>
                    </div>
                `;
            });
        }
    } catch (err) {
        loader.style.display = 'none';
        status.innerHTML = `<span style="color:var(--up)">連線失敗：代理伺服器繁忙中，請稍後再試，或檢查網路連線。</span>`;
        console.error(err);
    }
}
</script>

</body>
</html>
