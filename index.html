<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>台股 AI 即時掃描雷達</title>
    <style>
        :root { --bg: #0b0e14; --card: #1c2128; --up: #f23645; --down: #089981; --accent: #2962ff; }
        body { font-family: "Microsoft JhengHei", sans-serif; background: var(--bg); color: #d1d4dc; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        header { background: var(--card); padding: 30px; border-radius: 20px; text-align: center; border: 1px solid #30363d; margin-bottom: 25px; }
        .btn-scan { background: linear-gradient(135deg, #2962ff, #123db1); color: white; border: none; padding: 18px 45px; border-radius: 50px; font-size: 1.3rem; font-weight: bold; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 15px rgba(41,98,255,0.3); }
        .btn-scan:hover { transform: scale(1.05); box-shadow: 0 6px 20px rgba(41,98,255,0.5); }
        .status-area { margin-top: 20px; padding: 15px; background: rgba(0,0,0,0.3); border-radius: 10px; font-family: monospace; font-size: 0.9rem; color: #8b949e; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; margin-top: 25px; }
        .card { background: var(--card); border-radius: 15px; padding: 20px; border: 1px solid #30363d; border-left: 5px solid var(--accent); }
        .symbol { font-size: 1.6rem; font-weight: 900; color: #fff; }
        .name { font-size: 0.9rem; color: #8b949e; margin-left: 10px; }
        .price-box { display: flex; justify-content: space-between; align-items: baseline; margin: 15px 0; }
        .price { font-size: 2rem; font-weight: bold; }
        .change { font-size: 1.2rem; font-weight: bold; }
        .analysis { background: #0b0e14; padding: 12px; border-radius: 8px; font-size: 0.85rem; line-height: 1.6; }
        .footer-links { display: flex; gap: 10px; margin-top: 15px; }
        .btn-link { flex: 1; text-align: center; padding: 10px; background: #30363d; color: #fff; text-decoration: none; border-radius: 8px; font-size: 0.8rem; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>📡 台股 AI 即時掃描雷達</h1>
        <p>直接搜尋網路熱門標的，不設預設名單</p>
        <button class="btn-scan" onclick="startRadar()">開始即時搜尋市場熱點</button>
        <div id="status" class="status-area">等待指令中... 準備搜尋市場動態...</div>
    </header>

    <div id="results" class="grid"></div>
</div>

<script>
// 使用穩定代理伺服器
const proxy = "https://api.allorigins.win/get?url=";

async function startRadar() {
    const results = document.getElementById('results');
    const status = document.getElementById('status');
    results.innerHTML = '';
    
    status.innerHTML = "🌐 [1/2] 正在搜尋 Yahoo Finance 即時熱門榜單...";

    try {
        // 直接從網路獲取「目前全台股成交量最活跃」的標的
        const hotApi = "https://query2.finance.yahoo.com/v1/finance/screener/predefined/saved?formatted=false&scrIds=most_actives&count=50";
        const response = await fetch(`${proxy}${encodeURIComponent(hotApi)}`);
        const json = await response.json();
        const rawData = JSON.parse(json.contents);
        
        // 取得即時名單
        const activeList = rawData.finance.result[0].quotes
            .filter(q => q.symbol.endsWith('.TW') || q.symbol.endsWith('.TWO'))
            .map(q => ({
                ticker: q.symbol,
                name: q.shortName || "台股標的"
            }));

        if (activeList.length === 0) {
            status.innerHTML = "❌ 搜尋失敗：目前非交易時段或 API 限制，請稍後再試。";
            return;
        }

        status.innerHTML = `✅ 搜尋完成！發現 ${activeList.length} 檔即時火熱標的。<br>🔍 [2/2] 正在針對名單進行 MA 均線與量價 AI 分析...`;

        let candidates = [];

        // 逐一分析搜尋到的即時標的
        for (let item of activeList) {
            try {
                const chartUrl = `https://query1.finance.yahoo.com/v8/finance/chart/${item.ticker}?range=1mo&interval=1d`;
                const charRes = await fetch(`${proxy}${encodeURIComponent(chartUrl)}`);
                const charJson = await charRes.json();
                const stockData = JSON.parse(charJson.contents).chart.result[0];
                
                const close = stockData.indicators.adjclose[0].adjclose;
                const vol = stockData.indicators.quote[0].volume;
                
                if (close.length < 20) continue;

                const ma = (arr, n) => arr.slice(-n).reduce((a, b) => a + b) / n;
                const m5 = ma(close, 5);
                const m10 = ma(close, 10);
                const m20 = ma(close, 20);
                const v5 = ma(vol, 5);

                const currentPrice = close[close.length - 1];
                const change = ((currentPrice - close[close.length - 2]) / close[close.length - 2]) * 100;
                const volRatio = vol[vol.length - 1] / v5;

                // 選股 AI 邏輯：量能異常放大 + 站上均線
                if (currentPrice > m5 && volRatio > 1.2) {
                    candidates.push({
                        id: item.ticker.split('.')[0],
                        name: item.name,
                        price: currentPrice.toFixed(2),
                        change: change.toFixed(2),
                        vol: volRatio.toFixed(2),
                        isBull: m5 > m10 && m10 > m20,
                        score: (change * 1.5 + volRatio * 2).toFixed(1)
                    });
                }
            } catch (e) { console.error("分析錯誤", item.ticker); }
        }

        status.innerHTML = `🎯 分析完畢！今日市場熱門股中，有 ${candidates.length} 檔符合強勢進場特徵。`;
        
        candidates.sort((a, b) => b.score - a.score).forEach(s => {
            results.innerHTML += `
                <div class="card">
                    <div>
                        <span class="symbol">${s.id}</span>
                        <span class="name">${s.name}</span>
                    </div>
                    <div class="price-box">
                        <span class="price">${s.price}</span>
                        <span class="change" style="color:${s.change >= 0 ? 'var(--up)' : 'var(--down)'}">
                            ${s.change >= 0 ? '+' : ''}${s.change}%
                        </span>
                    </div>
                    <div class="analysis">
                        📈 <b>技術診斷：</b>${s.isBull ? '多頭排列 (強)' : '均線糾結 (整理)'}<br>
                        🔥 <b>量能指標：</b>今日成交量為均量的 ${s.vol} 倍
                    </div>
                    <div class="footer-links">
                        <a class="btn-link" target="_blank" href="https://www.google.com/search?q=${s.id}+新聞&tbm=nws">📰 搜新聞</a>
                        <a class="btn-link" target="_blank" href="https://tw.stock.yahoo.com/quote/${s.id}.TW">📊 看詳情</a>
                    </div>
                </div>
            `;
        });

    } catch (err) {
        status.innerHTML = "❌ 伺服器連線繁忙，請隔 10 秒後再次點擊「開始即時搜尋」。";
    }
}
</script>

</body>
</html>
