<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>即時雷達 - 強制顯示版</title>
    <style>
        :root { --bg: #05070a; --card: #161b22; --primary: #58a6ff; --up: #f85149; }
        body { font-family: sans-serif; background: var(--bg); color: #c9d1d9; padding: 20px; }
        .control-panel { background: #0d1117; padding: 30px; border-radius: 12px; text-align: center; border: 1px solid #30363d; }
        .btn-scan { background: #238636; color: white; border: none; padding: 15px 40px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 1.1rem; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; margin-top: 25px; }
        .card { background: #161b22; padding: 15px; border-radius: 8px; border: 1px solid #30363d; position: relative; }
        .ticker { font-size: 1.4rem; font-weight: bold; color: #58a6ff; }
        .status { margin-top: 15px; color: #8b949e; font-size: 0.85rem; }
        .error-log { color: #f85149; font-size: 0.8rem; margin-top: 5px; }
    </style>
</head>
<body>

<div class="control-panel">
    <h1>📡 即時熱門雷達 (強制顯示版)</h1>
    <p>如果此版本仍無數據，請按 F12 查看主控台錯誤</p>
    <button class="btn-scan" onclick="startScanner()">⚡ 執行強制掃描</button>
    <div id="status" class="status">等待指令...</div>
    <div id="debug-info" class="error-log"></div>
</div>

<div id="results" class="grid"></div>

<script>
// !!! 請務必填入你的 URL !!!
const myProxy = "https://script.google.com/macros/s/AKfycbyZr1LgjVdnm-jBQXeXg1mwIn3IwnI0L8qo6gsfTlgVFDhMIwdy6pqNKqxs5TUqlOE/exec";

async function startScanner() {
    const results = document.getElementById('results');
    const status = document.getElementById('status');
    const debug = document.getElementById('debug-info');
    
    results.innerHTML = '';
    debug.innerText = '';
    
    if(myProxy.includes("你的")) {
        status.innerText = "❌ 錯誤：你還沒填入 Google Script 網址！";
        return;
    }

    status.innerText = "🌐 正在嘗試連線私人通道...";

    try {
        // 抓取熱門榜單
        const hotUrl = "https://query2.finance.yahoo.com/v1/finance/screener/predefined/saved?formatted=false&scrIds=most_actives&count=40";
        const response = await fetch(`${myProxy}?url=${encodeURIComponent(hotUrl)}`);
        const rawData = await response.json();
        
        // 提取股票名單
        const activeStocks = rawData.finance.result[0].quotes;
        status.innerText = `✅ 找到 ${activeStocks.length} 檔熱門標的，開始強制渲染...`;

        for (let stock of activeStocks) {
            try {
                // 直接渲染基本資訊，不等待 K 線下載（減少出錯機會）
                const symbolStr = stock.symbol.split('.')[0];
                const price = stock.regularMarketPrice || "---";
                const change = stock.regularMarketChangePercent || 0;

                // 建立卡片
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="ticker">${symbolStr}</div>
                    <div style="font-size: 1.5rem; margin: 10px 0; color: ${change >= 0 ? '#f85149' : '#3fb950'}">
                        ${price} (${change >= 0 ? '+' : ''}${change.toFixed(2)}%)
                    </div>
                    <div style="font-size: 0.8rem; color: #8b949e;">
                        市場：${stock.fullExchangeName || '台股'} <br>
                        成交量：${stock.regularMarketVolume || '載入中'}
                    </div>
                `;
                results.appendChild(card);
            } catch (e) {
                console.error("單一股票渲染失敗", e);
            }
        }
        status.innerText = "🎯 掃描完成。如果畫面仍空，請確認 Google Script 部署是否選為「所有人」。";

    } catch (err) {
        status.innerText = "❌ 通道故障";
        debug.innerText = "錯誤訊息: " + err.message;
        console.error(err);
    }
}
</script>
</body>
</html>
