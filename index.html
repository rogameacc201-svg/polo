<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>台股熱門榜單即時雷達</title>
    <style>
        :root { --bg: #0d1117; --card: #161b22; --border: #30363d; --primary: #58a6ff; --up: #f85149; --down: #3fb950; }
        body { font-family: sans-serif; background: var(--bg); color: #c9d1d9; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .header { background: var(--card); padding: 30px; border-radius: 15px; border: 1px solid var(--border); text-align: center; width: 100%; max-width: 800px; margin-bottom: 25px; }
        .btn { background: #238636; color: white; border: none; padding: 15px 50px; border-radius: 8px; font-size: 1.2rem; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn:hover { background: #2ea043; transform: scale(1.05); }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; width: 100%; max-width: 1200px; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; border-left: 6px solid #444; }
        .price { font-size: 2.5rem; font-weight: 900; margin: 10px 0; }
    </style>
</head>
<body>

<div class="header">
    <h1>🔥 台股成交量排行掃描</h1>
    <p>自動抓取 Yahoo 奇摩股市當日前 20 名熱門標的</p>
    <button class="btn" onclick="fetchData()">⚡ 開始掃描熱門榜單</button>
    <div id="status" style="margin-top:15px; color:#8b949e">等待指令中...</div>
</div>

<div id="results" class="grid"></div>

<script>
    // ⚠️ 請在此處填入你剛才重新部署的 GAS 網址
    const gasUrl = "https://script.google.com/macros/s/AKfycbzeCQJslIYaX6ehDhhxJvnvBnf3B69HXovmIXoGz3aCwRWVzkHKQ81KYMyvwFWUT63S/exec";

    async function fetchData() {
        const results = document.getElementById('results');
        const status = document.getElementById('status');
        
        if(gasUrl.includes("你的")) { alert("請先填入 GAS 網址！"); return; }
        
        results.innerHTML = "";
        status.innerText = "⏳ 正在穿透抓取 Yahoo 熱門榜單數據...";

        try {
            const res = await fetch(gasUrl);
            const data = await res.json();

            if (data.error) throw new Error(data.error);

            const list = data.quoteResponse.result;
            list.forEach(s => {
                const change = s.regularMarketChangePercent || 0;
                const isUp = change >= 0;
                const card = document.createElement('div');
                card.className = "card";
                card.style.borderLeftColor = isUp ? "var(--up)" : "var(--down)";
                card.innerHTML = `
                    <div style="display:flex; justify-content:space-between; align-items:center">
                        <span style="color:var(--primary); font-weight:bold; font-size:1.3rem">${s.symbol.replace('.TW','')}</span>
                        <span style="color:#8b949e">${s.shortName || ''}</span>
                    </div>
                    <div class="price" style="color:${isUp ? 'var(--up)' : 'var(--down)'}">
                        ${(s.regularMarketPrice || 0).toFixed(2)}
                        <span style="font-size:1.2rem; margin-left:10px">${isUp ? '▲' : '▼'}${Math.abs(change).toFixed(2)}%</span>
                    </div>
                    <div style="font-size:0.9rem; color:#8b949e; border-top:1px solid #333; padding-top:10px">
                        成交量：${Math.floor((s.regularMarketVolume || 0) / 1000).toLocaleString()} 張
                    </div>
                `;
                results.appendChild(card);
            });

            status.innerText = `✅ 掃描完成！更新時間：${new Date().toLocaleTimeString()}`;

        } catch (err) {
            status.innerText = "❌ 錯誤：" + err.message;
            console.error(err);
        }
    }
</script>

</body>
</html>
