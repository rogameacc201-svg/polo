<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台股即時動態雷達</title>
    <style>
        :root {
            --bg: #0d1117;
            --card: #161b22;
            --border: #30363d;
            --primary: #58a6ff;
            --up: #f85149;
            --down: #3fb950;
        }
        body {
            font-family: -apple-system, system-ui, sans-serif;
            background: var(--bg);
            color: #c9d1d9;
            margin: 0;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        .header {
            background: var(--card);
            padding: 25px;
            border-radius: 12px;
            border: 1px solid var(--border);
            text-align: center;
            margin-bottom: 25px;
        }
        .btn-scan {
            background: #238636;
            color: white;
            border: none;
            padding: 14px 40px;
            border-radius: 6px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-scan:hover { background: #2ea043; transform: scale(1.02); }
        .status-bar { margin-top: 15px; font-size: 0.9rem; color: #8b949e; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 18px;
            border-left: 5px solid transparent;
        }
        .card.is-up { border-left-color: var(--up); }
        .card.is-down { border-left-color: var(--down); }
        .symbol { font-size: 1.4rem; font-weight: bold; color: var(--primary); }
        .name { font-size: 0.9rem; color: #8b949e; margin-left: 8px; }
        .price-box { margin: 15px 0; display: flex; align-items: baseline; }
        .price { font-size: 2.2rem; font-weight: 800; }
        .pct { font-size: 1.1rem; margin-left: 10px; font-weight: bold; }
        .details {
            font-size: 0.85rem;
            color: #8b949e;
            border-top: 1px solid #2d333b;
            padding-top: 10px;
            display: flex;
            justify-content: space-between;
        }
        #debug {
            background: #000;
            color: #0f0;
            padding: 15px;
            font-size: 12px;
            border-radius: 6px;
            margin-top: 15px;
            display: none;
            text-align: left;
            white-space: pre-wrap;
            border: 1px solid #444;
            max-height: 200px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🔍 台股即時掃描 (熱門榜單)</h1>
        <p>系統將自動搜尋目前市場上交易量最活躍的標的</p>
        <button class="btn-scan" onclick="startScan()">⚡ 掃描即時熱門標的</button>
        <div id="status" class="status-bar">準備就緒</div>
        <div id="debug"></div>
    </div>

    <div id="results" class="grid"></div>
</div>

<script>
    // ⚠️ 請確保你的 GAS 代碼已經更新為最新的「偽裝瀏覽器」版本，並已重新發布
    const myProxy = "https://script.google.com/macros/s/AKfycbzomDPhtm28NHi8s4tWhwZJ90p4Gg0XVgyQ4xR1KtiW2satBLblV5peSngnEo6QdakN/exec";

    async function startScan() {
        const results = document.getElementById('results');
        const status = document.getElementById('status');
        const debug = document.getElementById('debug');

        results.innerHTML = "";
        debug.style.display = "none";
        status.innerText = "⏳ 正在檢索台股即時排行榜...";

        try {
            // 這個接口是 Yahoo Finance 專門給台股熱門榜單使用的搜尋接口
            // count=100 表示抓取前 100 筆熱門股票
            const target = `https://query2.finance.yahoo.com/v1/finance/screener/predefined/saved?scrIds=most_actives_taiwan&count=100`;
            const finalUrl = `${myProxy}?url=${encodeURIComponent(target)}`;

            const response = await fetch(finalUrl);
            const text = await response.text();
            
            const data = JSON.parse(text);

            // 結構化解析：Yahoo 排行榜的資料路徑通常在 finance.result[0].quotes
            let stocks = [];
            if (data.finance && data.finance.result && data.finance.result[0]) {
                stocks = data.finance.result[0].quotes || [];
            }

            if (stocks.length === 0) {
                // 如果榜單失敗，嘗試第二備援接口（成交量排行）
                status.innerText = "⚠️ 榜單接口無回應，嘗試備援掃描...";
                return handleBackup(status, results, debug);
            }

            renderStocks(stocks);
            status.innerText = `✅ 掃描成功！已自動偵測 ${stocks.length} 檔熱門成交標的`;

        } catch (err) {
            status.innerText = "❌ 掃描失敗";
            debug.style.display = "block";
            debug.innerText = "錯誤日誌：\n" + err.message + "\n\n回傳內容節錄：\n" + (typeof text !== 'undefined' ? text.substring(0, 500) : "無回傳資料");
        }
    }

    async function handleBackup(status, results, debug) {
        // 使用更寬鬆的綜合搜尋接口
        const target = "https://query2.finance.yahoo.com/v1/finance/screener/predefined/saved?scrIds=all_taiwan_active&count=50";
        try {
            const finalUrl = `${myProxy}?url=${encodeURIComponent(target)}`;
            const response = await fetch(finalUrl);
            const data = JSON.parse(await response.text());
            const stocks = data.finance.result[0].quotes || [];
            renderStocks(stocks);
            status.innerText = `✅ 備援掃描成功！已抓取 ${stocks.length} 檔標的`;
        } catch (e) {
            status.innerText = "❌ 排行榜接口完全失效，Yahoo 目前可能正在限制存取。";
        }
    }

    function renderStocks(list) {
        const results = document.getElementById('results');
        list.forEach(s => {
            const price = s.regularMarketPrice || 0;
            const change = s.regularMarketChangePercent || 0;
            const isUp = change >= 0;

            const card = document.createElement('div');
            card.className = `card ${isUp ? 'is-up' : 'is-down'}`;
            card.innerHTML = `
                <div class="stock-header">
                    <div class="symbol">${s.symbol.replace('.TW','').replace('.TWO','')}</div>
                    <div class="name">${s.shortName || ''}</div>
                </div>
                <div class="price-box" style="color: ${isUp ? 'var(--up)' : 'var(--down)'}">
                    <div class="price">${price.toFixed(2)}</div>
                    <div class="pct">${isUp ? '▲' : '▼'}${Math.abs(change).toFixed(2)}%</div>
                </div>
                <div class="details">
                    <span>成交：${Math.floor((s.regularMarketVolume || 0) / 1000)} 張</span>
                    <span>昨收：${(s.regularMarketPreviousClose || 0).toFixed(2)}</span>
                </div>
            `;
            results.appendChild(card);
        });
    }
</script>

</body>
</html>
