<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bingo Bingo 即時看板</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: white; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .container { background: #1e293b; border-radius: 15px; padding: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); width: 100%; max-width: 450px; text-align: center; }
        h1 { color: #f59e0b; margin-top: 0; }
        .ball-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-top: 20px; }
        .ball { width: 45px; height: 45px; line-height: 45px; background: #ef4444; color: white; border-radius: 50%; font-weight: bold; font-size: 18px; box-shadow: inset -3px -3px 5px rgba(0,0,0,0.3); }
        .ball.special { background: #3b82f6; } /* 假設最後一個是特別號 */
        .info { font-size: 12px; color: #94a3b8; margin-top: 15px; }
        .loader { color: #60a5fa; margin: 20px 0; }
    </style>
</head>
<body>

<div class="container">
    <h1>Bingo Bingo 實時號碼</h1>
    <div id="loader">連線抓取中...</div>
    <div id="balls" class="ball-grid"></div>
    <div class="info" id="update-time"></div>
    <button onclick="fetchNumbers()" style="margin-top:20px; padding:8px 16px; cursor:pointer;">手動更新</button>
</div>

<script>
    async function fetchNumbers() {
        const loader = document.getElementById('loader');
        const ballGrid = document.getElementById('balls');
        const timeLabel = document.getElementById('update-time');
        
        loader.style.display = 'block';
        loader.innerText = '正在穿透防火牆...';

        // 我們改用另一個免權限的 CORS 代理，並抓取一個結構超簡單的備用來源
        const proxy = "https://api.allorigins.win/get?url=";
        const target = encodeURIComponent("https://www.lotto-8.com/list_bingobingo.asp");

        try {
            const response = await fetch(proxy + target);
            if (!response.ok) throw new Error('代理伺服器異常');
            
            const data = await response.json();
            const html = data.contents;
            
            // 使用最原始的數字匹配法 (匹配 ball_red 類別後的數字)
            const regex = /ball_red">(\d{2})<\/td>/g;
            let match;
            let numbers = [];
            
            while ((match = regex.exec(html)) !== null) {
                numbers.push(match[1]);
                if (numbers.length >= 20) break;
            }

            if (numbers.length > 0) {
                loader.style.display = 'none';
                ballGrid.innerHTML = '';
                numbers.forEach((num, idx) => {
                    const div = document.createElement('div');
                    div.className = 'ball';
                    div.innerText = num;
                    ballGrid.appendChild(div);
                });
                timeLabel.innerText = "最後更新：" + new Date().toLocaleTimeString();
            } else {
                loader.innerText = "抓取成功但無資料，請稍後再試";
            }
        } catch (err) {
            loader.innerText = "連線失敗：" + err.message;
        }
    }

    // 啟動與自動循環
    fetchNumbers();
    setInterval(fetchNumbers, 60000); // 每一分鐘更新一次
</script>

</body>
</html>
