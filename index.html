<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>全功能抽獎機 - 簡潔版</title>
    <style>
        :root {
            --primary-gold: #ffd700;
            --bg-dark: #0f0c29;
            --neon-blue: #00f2ff;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(to bottom, #0f0c29, #302b63, #24243e);
            color: white;
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 10px;
            min-height: 100vh;
            overflow-x: hidden;
        }

        h1 {
            color: var(--primary-gold);
            font-size: 1.6rem;
            margin: 15px 0;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.6);
            letter-spacing: 3px;
        }

        .controls {
            width: 100%;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            padding: 15px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 20px;
        }

        .settings-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-size: 0.75rem;
            color: var(--neon-blue);
        }

        input {
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--neon-blue);
            font-size: 1rem;
            background: rgba(0, 0, 0, 0.5);
            color: white;
            text-align: center;
            width: 100%;
        }

        button {
            width: 100%;
            background: linear-gradient(135deg, #00f2ff, #0061ff);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: bold;
            margin-top: 15px;
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.3);
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #ball-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            width: 100%;
            max-width: 100%;
            padding: 10px 0;
        }

        .box {
            width: 48px;
            height: 48px;
            border-radius: 8px;
            font-size: 1.2rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.3);
            flex-shrink: 0;
            animation: cubeIn 0.4s ease-out forwards;
        }

        @keyframes cubeIn {
            0% { transform: translateY(-30px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        .result-section {
            width: 100%;
            border-top: 1px dashed var(--primary-gold);
            padding-top: 15px;
            display: none;
        }

        .result-title { text-align: center; color: var(--primary-gold); font-size: 0.9rem; margin-bottom: 10px; }

        #sorted-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px;
        }

        .small-box {
            width: 32px;
            height: 32px;
            border-radius: 4px;
            background: #fff;
            color: #000;
            font-weight: bold;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 霓虹邊框顏色 */
        .c1 { border-color: #ff5252; color: #ff5252; box-shadow: 0 0 8px rgba(255, 82, 82, 0.3); }
        .c2 { border-color: #448aff; color: #448aff; box-shadow: 0 0 8px rgba(68, 138, 255, 0.3); }
        .c3 { border-color: #66bb6a; color: #66bb6a; box-shadow: 0 0 8px rgba(102, 187, 106, 0.3); }
        .c4 { border-color: #ffa726; color: #ffa726; box-shadow: 0 0 8px rgba(255, 167, 38, 0.3); }
        .c5 { border-color: #e040fb; color: #e040fb; box-shadow: 0 0 8px rgba(224, 64, 251, 0.3); }
    </style>
</head>
<body>

    <h1>抽獎機</h1>

    <div class="controls">
        <div class="settings-grid">
            <div class="input-group">
                <label>號碼總數</label>
                <input type="number" id="maxPool" value="80" min="1">
            </div>
            <div class="input-group">
                <label>抽出數量</label>
                <input type="number" id="drawCount" value="20" min="1">
            </div>
        </div>
        <button id="startBtn" onclick="startDraw()">啟動系統</button>
    </div>

    <div id="ball-container"></div>

    <div id="result-section" class="result-section">
        <div class="result-title">━━ 最終結果排列 ━━</div>
        <div id="sorted-container"></div>
    </div>

    <script>
        const maxPoolInput = document.getElementById('maxPool');
        const drawCountInput = document.getElementById('drawCount');
        const container = document.getElementById('ball-container');
        const sortedContainer = document.getElementById('sorted-container');
        const resultSection = document.getElementById('result-section');
        const btn = document.getElementById('startBtn');

        async function startDraw() {
            const maxPool = parseInt(maxPoolInput.value);
            const drawCount = parseInt(drawCountInput.value);

            if (isNaN(maxPool) || isNaN(drawCount) || drawCount > maxPool || drawCount < 1) {
                alert("請檢查輸入數值是否正確（抽出數量不可大於總數）");
                return;
            }

            // 初始化介面
            container.innerHTML = '';
            sortedContainer.innerHTML = '';
            resultSection.style.display = 'none';
            btn.disabled = true;

            // 準備號碼池
            let pool = Array.from({length: maxPool}, (_, i) => i + 1);
            let results = [];

            // 隨機抽籤
            for (let i = 0; i < drawCount; i++) {
                const randomIndex = Math.floor(Math.random() * pool.length);
                results.push(pool.splice(randomIndex, 1)[0]);
            }

            // 顯示落下動畫
            for (let i = 0; i < results.length; i++) {
                const box = document.createElement('div');
                const colorClass = 'c' + (Math.floor(Math.random() * 5) + 1);
                box.className = `box ${colorClass}`;
                box.innerHTML = results[i];

                container.appendChild(box);
                
                // 每次增加內容時檢查捲動
                if (i % 3 === 0) {
                    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
                }
                
                await new Promise(r => setTimeout(r, 120));
            }

            // 顯示最終排序
            await new Promise(r => setTimeout(r, 500));
            const sortedResults = [...results].sort((a, b) => a - b);
            resultSection.style.display = 'block';

            for (let num of sortedResults) {
                const sBox = document.createElement('div');
                sBox.className = 'small-box';
                sBox.innerHTML = num;
                sortedContainer.appendChild(sBox);
                await new Promise(r => setTimeout(r, 30));
            }

            btn.disabled = false;
        }
    </script>
</body>
</html>
