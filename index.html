<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>賓果賓果即時監測</title>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; background: #f4f4f9; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 95%; max-width: 1000px; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .status { color: #d9534f; font-weight: bold; }
        #timer { color: #0275d8; }
        iframe { width: 100%; height: 600px; border: 1px solid #ddd; border-radius: 5px; }
        .info { margin-top: 10px; font-size: 14px; color: #666; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>賓果賓果資料即時更新</h2>
        <div class="status">
            下一期更新倒數：<span id="timer">60</span> 秒
        </div>
    </div>

    <!-- 嵌入目標網頁 -->
    <iframe id="bingoFrame" src="https://www.pilio.idv.tw/bingo/list.asp?auto=1"></iframe>

    <div class="info">
        * 註：此頁面每 60 秒會自動強制重新載入下方內嵌頁面，以獲取最新開獎資訊。
    </div>
</div>

<script>
    let timeLeft = 60;
    const timerElement = document.getElementById('timer');
    const iframe = document.getElementById('bingoFrame');

    function updateTimer() {
        timeLeft--;
        if (timeLeft <= 0) {
            // 重新載入 iframe
            iframe.src = iframe.src;
            timeLeft = 60;
            console.log("資料已更新: " + new Date().toLocaleTimeString());
        }
        timerElement.textContent = timeLeft;
    }

    // 每秒更新一次倒數計時
    setInterval(updateTimer, 1000);
</script>

</body>
</html>
