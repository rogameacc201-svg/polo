<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>賓果賓果即時監測 - 修正版</title>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; background: #eceff1; margin: 0; padding: 20px; }
        .container { width: 100%; max-width: 950px; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin: auto; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid #004a99; padding-bottom: 10px; margin-bottom: 20px; }
        #timer { font-weight: bold; color: #d32f2f; font-size: 1.2em; }
        
        /* 讓表格在手機上能滑動 */
        #data-container { overflow-x: auto; width: 100%; }
        
        /* 強制美化抓取回來的表格 */
        table { width: 100% !important; border-collapse: collapse; margin-top: 10px; font-size: 15px; }
        th, td { border: 1px solid #cfd8dc !important; padding: 8px !important; text-align: center !important; }
        tr:nth-child(even) { background-color: #f8f9fa; }
        
        /* 修正球號圖片顯示 */
        img { width: 24px; height: 24px; vertical-align: middle; margin: 1px; }
        
        .msg { padding: 40px; text-align: center; color: #607d8b; font-size: 18px; }
        .error { color: #c62828; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2 style="margin:0; color:#004a99;">BINGO BINGO 實時數據</h2>
        <div>更新倒數：<span id="timer">60</span> 秒</div>
    </div>

    <div id="data-container">
        <div class="msg">連線中，請稍候...</div>
    </div>
</div>

<script>
    let seconds = 60;
    const timerBox = document.getElementById('timer');
    const display = document.getElementById('data-container');

    async function getData() {
        const target = "https://www.pilio.idv.tw/bingo/list.asp?auto=1";
        // 使用另一個常用的代理轉接，增加穩定性
        const proxy = `https://corsproxy.io/?${encodeURIComponent(target)}`;

        try {
            const res = await fetch(proxy);
            if (!res.ok) throw new Error("代理伺服器回應錯誤");

            const buffer = await res.arrayBuffer();
            const html = new TextDecoder('big5').decode(buffer);
            const doc = new DOMParser().parseFromString(html, 'text/html');

            // 改用更寬鬆的搜尋方式：尋找所有表格，找出列數較多且包含開獎關鍵字的那個
            const allTables = doc.querySelectorAll('table');
            let mainTable = null;

            for (let t of allTables) {
                const text = t.innerText;
                // 辨識特徵：包含「期別」且欄位數大於 5 (排除小選單)
                if (text.includes('期別') && t.rows.length > 3) {
                    mainTable = t;
                    break; 
                }
            }

            if (mainTable) {
                // 1. 修正圖片 URL (從相對路徑改為絕對路徑)
                mainTable.querySelectorAll('img').forEach(img => {
                    let src = img.getAttribute('src');
                    if (src && !src.startsWith('http')) {
                        img.src = "https://www.pilio.idv.tw/bingo/" + src;
                    }
                });

                // 2. 清除所有超連結，避免點擊跳走
                mainTable.querySelectorAll('a').forEach(a => a.removeAttribute('href'));

                // 3. 顯示結果
                display.innerHTML = "";
                display.appendChild(mainTable);
            } else {
                display.innerHTML = "<div class='msg error'>解析失敗：找不到資料表格結構。</div>";
            }

        } catch (err) {
            display.innerHTML = `<div class='msg error'>抓取失敗：${err.message}</div>`;
        }
    }

    // 倒數與自動更新
    setInterval(() => {
        seconds--;
        timerBox.innerText = seconds;
        if (seconds <= 0) {
            seconds = 60;
            getData();
        }
    }, 1000);

    // 網頁開啟時先跑一次
    getData();
</script>

</body>
</html>
