<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>極簡全螢幕播放器</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body, html {
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: "Microsoft JhengHei", Arial, sans-serif;
        }

        /* 偵測區：當滑鼠移到上方 50px 範圍內，顯示控制列 */
        .hover-trigger {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px; /* 觸發範圍 */
            z-index: 20; /* 確保在最上層偵測滑鼠 */
        }

        /* 控制列 */
        .controls {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 21; /* 層級需高於觸發區，才能點到輸入框 */
            padding: 15px;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            gap: 10px;
            transition: transform 0.4s ease-in-out;
            transform: translateY(0); /* 預設顯示 */
        }

        /* 播放時隱藏 */
        .controls.hidden {
            transform: translateY(-100%);
        }

        /* 當滑鼠移到觸發區或控制列本身時，顯示控制列 */
        .hover-trigger:hover + .controls, .controls:hover {
            transform: translateY(0);
        }

        input {
            padding: 12px;
            width: 60%;
            max-width: 500px;
            border: 1px solid #444;
            background: #222;
            color: #fff;
            border-radius: 4px;
            outline: none;
        }

        input:focus { border-color: #ff0000; }

        button {
            padding: 10px 20px;
            cursor: pointer;
            background: #ff0000;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
        }

        button:hover { background: #cc0000; }

        .video-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <!-- 1. 偵測區 -->
    <div class="hover-trigger"></div>

    <!-- 2. 控制列 -->
    <div class="controls" id="controlBar">
        <input type="text" id="videoUrl" placeholder="貼上網址並按 Enter 播放...">
        <button onclick="playVideo()">播放</button>
    </div>

    <!-- 3. 影片區 -->
    <div class="video-wrapper">
        <iframe id="player" src="" allow="autoplay; encrypted-media" allowfullscreen></iframe>
    </div>

    <script>
        const controlBar = document.getElementById('controlBar');
        const urlInput = document.getElementById('videoUrl');

        function playVideo() {
            const videoId = extractVideoID(urlInput.value);

            if (videoId) {
                const player = document.getElementById('player');
                // 嵌入網址 + 自動播放與介面優化參數
                player.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&modestbranding=1&iv_load_policy=3&rel=0`;
                
                // 延遲一秒後自動縮起（給使用者一點反應時間）
                setTimeout(() => {
                    controlBar.classList.add('hidden');
                }, 1000);
            } else {
                alert("請確認 YouTube 網址是否正確！");
            }
        }

        function extractVideoID(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        // 監聽 Enter 鍵
        urlInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') playVideo();
        });
    </script>

</body>
</html>
