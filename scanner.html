<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>AI 台股自動選股掃描儀</title>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --up: #ef4444; --down: #22c55e; --accent: #3b82f6; }
        body { font-family: -apple-system, "Noto Sans TC", sans-serif; background: var(--bg); color: var(--text); padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 30px; }
        .btn-scan { background: var(--accent); color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-size: 1.1em; transition: 0.3s; }
        .btn-scan:hover { background: #2563eb; transform: scale(1.05); }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-top: 20px; }
        .card { background: var(--card); border-radius: 12px; padding: 20px; border-left: 5px solid var(--accent); animation: fadeIn 0.5s; }
        .score-badge { float: right; background: #ea580c; padding: 4px 8px; border-radius: 4px; font-size: 0.8em; }
        .stat { display: flex; justify-content: space-between; margin: 10px 0; font-size: 0.9em; color: #94a3b8; }
        .highlight { color: var(--text); font-weight: bold; }
        .news-link { display: inline-block; margin-top: 10px; color: var(--accent); text-decoration: none; font-size: 0.9em; }
        #loading { display: none; text-align: center; margin: 20px; color: var(--accent); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🤖 AI 強勢股自動掃描器</h1>
        <p>自動掃描 5MA/10MA/20MA 多頭排列 + 量能爆發標的</p>
        <button class="btn-scan" onclick="startScan()">立即掃描潛力股</button>
        <div id="loading">正在擷取最新數據並分析中...</div>
    </header>

    <div id="results" class="grid"></div>
</div>

<script>
// 設定要掃描的標的池 (可持續增加)
const stockPool = [
    '2330.TW', '2317.TW', '2454.TW', '2308.TW', '2382.TW', 
    '2603.TW', '2609.TW', '2303.TW', '3231.TW', '6669.TW', 
    '2881.TW', '2882.TW', '1513.TW', '1519.TW', '2357.TW'
];

async function startScan() {
    const resultsDiv = document.getElementById('results');
    const loading = document.getElementById('loading');
    resultsDiv.innerHTML = '';
    loading.style.display = 'block';

    let candidates = [];

    for (let ticker of stockPool) {
        try {
            // 抓取近一個月的數據 (使用 Yahoo Finance 公開 API 格式)
            const response = await fetch(`https://query1.finance.yahoo.com/v8/finance/chart/${ticker}?range=1mo&interval=1d`);
            const data = await response.json();
            const quotes = data.chart.result[0].indicators.quote[0];
            const closePrices = data.chart.result[0].indicators.adjclose[0].adjclose;
            const volumes = quotes.volume;

            // 計算 MA
            const ma = (arr, len) => arr.slice(-len).reduce((a, b) => a + b) / len;
            const ma5 = ma(closePrices, 5);
            const ma10 = ma(closePrices, 10);
            const ma20 = ma(closePrices, 20);
            const vma5 = ma(volumes, 5);

            const currentPrice = closePrices[closePrices.length - 1];
            const prevPrice = closePrices[closePrices.length - 2];
            const currentVol = volumes[volumes.length - 1];
            const change = ((currentPrice - prevPrice) / prevPrice) * 100;

            // --- 篩選邏輯 ---
            // 1. 均線多頭排列：5MA > 10MA > 20MA
            // 2. 價格站上所有均線
            // 3. 今日量能 > 5日均量 1.2 倍
            if (ma5 > ma10 && ma10 > ma20 && currentPrice > ma5 && currentVol > vma5 * 1.2) {
                let score = change + (currentVol / vma5); // 簡單評分：漲幅 + 量能比
                candidates.push({
                    id: ticker.split('.')[0],
                    price: currentPrice.toFixed(2),
                    change: change.toFixed(2),
                    volRatio: (currentVol / vma5).toFixed(2),
                    score: score.toFixed(2)
                });
            }
        } catch (e) { console.error(`無法讀取 ${ticker}`); }
    }

    loading.style.display = 'none';
    
    // 按評分排序
    candidates.sort((a, b) => b.score - a.score);

    if (candidates.length === 0) {
        resultsDiv.innerHTML = '<p style="text-align:center; width:100%;">今日暫無符合「多頭起漲」條件的股票。</p>';
    } else {
        candidates.slice(0, 5).forEach(s => {
            resultsDiv.innerHTML += `
                <div class="card">
                    <span class="score-badge">智慧評分: ${s.score}</span>
                    <h2 style="margin:0">${s.id}</h2>
                    <div class="stat"><span>目前股價</span><span class="highlight">${s.price}</span></div>
                    <div class="stat"><span>今日漲幅</span><span class="highlight" style="color:var(--up)">+${s.change}%</span></div>
                    <div class="stat"><span>量能放大</span><span class="highlight">${s.volRatio} 倍</span></div>
                    <div class="stat"><span>均線狀態</span><span style="color:#22c55e">● 多頭排列 (5>10>20)</span></div>
                    <a href="https://www.google.com/search?q=${s.id}+新聞&tbm=nws" target="_blank" class="news-link">🔍 查看利多新聞消息</a>
                </div>
            `;
        });
    }
}
</script>

</body>
</html>
